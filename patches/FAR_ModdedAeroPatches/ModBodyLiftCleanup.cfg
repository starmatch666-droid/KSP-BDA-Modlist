// BDArmory / Fishy：低阻战斗相机
@PART[combat_cam]:HAS[@MODULE[ModuleLiftingSurface]]:NEEDS[FerramAerospaceResearch,fishy_weapons_dev]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleLiftingSurface] {}
}
