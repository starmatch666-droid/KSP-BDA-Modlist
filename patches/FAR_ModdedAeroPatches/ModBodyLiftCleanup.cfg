// ReStockPlus：加大号热盾
@PART[restock-heatshield-*]:HAS[@MODULE[ModuleLiftingSurface]]:NEEDS[FerramAerospaceResearch,ReStockPlus]:AFTER[FerramAerospaceResearch]
