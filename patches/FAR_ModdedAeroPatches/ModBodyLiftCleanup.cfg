// ============================================================================
//  FAR 适配补丁：第三方部件的“原版升力面”清理
//  文件位置：GameData/FAR_ModdedAeroPatches/ModBodyLiftCleanup.cfg
//  依赖：FerramAerospaceResearch（FAR）
//
//  背景：FAR 会移除所有原版部件上的 ModuleLiftingSurface（让 FAR 的体素气动
//  完全接管升力/阻力）。不少第三方部件（座舱、适配器、脊线、结构段等）也带
//  这个原版模块，FAR 不会自动处理它们；保留下来会造成原版升力与 FAR 升力
//  叠加。这个文件按 FAR 对原版部件的处理方式，清掉这些部件的原版升力面并把
//  原版阻力参数归零。
//
//  注意：
//   * 已带 FAR 机翼/舵面模块的部件（大部分机翼 mod 自带 FAR 补丁）不会匹配
//     这些 HAS 条件，所以不会被重复处理。
//   * NearFutureAeronautics 的升力风扇（nfa-liftfan-*）靠 ModuleLiftingSurface
//     产生升力，FAR 又没有替代模型，因此保留不动。
//   * AirplanePlus / SXT / Mk3Expansion / 原版热盾等已经由各自的 FAR 兼容补丁
//     完成同样的清理，这里不再重复。
// ============================================================================

// Mk2 Expansion：机身、座舱、适配器、脊线、结构件等
@PART[M2X_*]:HAS[@MODULE[ModuleLiftingSurface]]:NEEDS[FerramAerospaceResearch,Mk2Expansion]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleLiftingSurface] {}
}
@PART[Mk1Chine*]:HAS[@MODULE[ModuleLiftingSurface]]:NEEDS[FerramAerospaceResearch,Mk2Expansion]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleLiftingSurface] {}
}

