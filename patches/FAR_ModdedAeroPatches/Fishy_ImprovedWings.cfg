// ============================================================================
//  FAR 适配补丁：BDArmory / Fishy 武器包里的 “improved wings” 机翼
//  文件位置：GameData/FAR_ModdedAeroPatches/Fishy_ImprovedWings.cfg
//  依赖：FerramAerospaceResearch（FAR）+ fishy_weapons_dev
//
//  这两个部件复用了原版机翼模型，但没有 FAR 配置，因此这里直接沿用
//  FAR 对相应原版部件使用的几何数据。
// ============================================================================

// gliderWingB 使用 Squad/Parts/Aero/wings/swept2 模型
//  -> 沿用 FAR 对 sweptWing2 的几何参数
@PART[gliderWingB]:NEEDS[FerramAerospaceResearch,fishy_weapons_dev]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleLiftingSurface] {}
    %MODULE[FARWingAerodynamicModel]
    {
        %b_2 = 3.75
        %MAC = 2.25
        %TaperRatio = 1
        %MidChordSweep = 26.57
    }
}

// structuralWing10 使用 Squad/Parts/Aero/wingletAV-R8/model.mu 模型
//  -> 沿用 FAR 对 R8winglet（AV-R8 翼尖小翼）的几何参数
@PART[structuralWing10]:NEEDS[FerramAerospaceResearch,fishy_weapons_dev]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleLiftingSurface] {}
    %MODULE[FARWingAerodynamicModel]
    {
        %b_2 = 1.388
        %MAC = 1.311
        %TaperRatio = 0.611
        %MidChordSweep = 27.6
    }
}

// 注意：同一文件夹里的 AV-R9_1（AV-R9 翼尖小翼）配置里没有可用的 .mu 模型，
// 该部件本身在游戏里无法正常加载，所以这里不做处理。
