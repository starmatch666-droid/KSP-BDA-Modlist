// ============================================================================
//  FAR 适配补丁：SpikeX（Nesd 的 Spike-X 系列）气动部件
//  文件位置：GameData/FAR_ModdedAeroPatches/SpikeX_Wings.cfg
//  依赖：FerramAerospaceResearch（FAR）+ SpikeX
//
//  作用：把 SpikeX 的机翼/舵面从原版气动模块转换成 FAR 模块：
//    * 可动舵面 -> FARControllableSurface
//    * 固定翼面 -> FARWingAerodynamicModel
//  并把原版模块移除、把原版阻力参数归零（与 FAR 给原版部件打补丁的做法一致）。
//
//  几何参数说明（b_2 = 翼展，MAC = 平均弦长，TaperRatio = 梢根比，
//  MidChordSweep = 中弦线后掠角）是根据 .mu 模型的平面形状测量得到的，
//  取值方式与 FAR 自带配置相同（S = b_2 * MAC 与模型面积吻合）。
//  如果实飞手感不合适，可以直接改下面这些数值再进游戏测试。
// ============================================================================

// Spike-X Wing 1 —— 可动全动舵面，面积约 0.52 m²，弦长约 1.19 m
@PART[NesdSpX_Wing1]:NEEDS[FerramAerospaceResearch,SpikeX]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleControlSurface] {}
    %MODULE[FARControllableSurface]
    {
        %b_2 = 0.662
        %MAC = 0.791
        %TaperRatio = 0.37
        %MidChordSweep = 39.8
        %nonSideAttach = 1
        %maxdeflect = 30
        %ctrlSurfFrac = 1.0
        %transformName = SpXwing1
    }
}

// Spike-X Wing 1 extended —— 加长型可动舵面，原版配置里只有 50% 面积参与操纵
@PART[NesdSpX_Wing1e]:NEEDS[FerramAerospaceResearch,SpikeX]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleControlSurface] {}
    %MODULE[FARControllableSurface]
    {
        %b_2 = 1.063
        %MAC = 1.071
        %TaperRatio = 0.27
        %MidChordSweep = 40.7
        %nonSideAttach = 1
        %maxdeflect = 30
        %ctrlSurfFrac = 0.5
        %transformName = SpXwing1E
    }
}

// Spike-X Wing 1 fixed —— 固定翼面（原版 ModuleLiftingSurface）
@PART[NesdSpX_Wing1f]:NEEDS[FerramAerospaceResearch,SpikeX]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleLiftingSurface] {}
    %MODULE[FARWingAerodynamicModel]
    {
        %b_2 = 0.644
        %MAC = 0.807
        %TaperRatio = 0.37
        %MidChordSweep = 41.0
    }
}

// Spike-X Wing 2 —— 带襟翼的机翼段，约 30% 面积是活动面
@PART[NesdSpX_Wing2]:NEEDS[FerramAerospaceResearch,SpikeX]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleControlSurface] {}
    %MODULE[FARControllableSurface]
    {
        %b_2 = 1.483
        %MAC = 1.857
        %TaperRatio = 0.37
        %MidChordSweep = 41.1
        %nonSideAttach = 1
        %maxdeflect = 20
        %ctrlSurfFrac = 0.3
        %transformName = SpXwing2flap
    }
}

// Spike-X Wing 3 —— 带燃油的机翼段，约 30% 面积是活动面
@PART[NesdSpX_Wing3]:NEEDS[FerramAerospaceResearch,SpikeX]:AFTER[FerramAerospaceResearch]
{
    @maximum_drag = 0
    @minimum_drag = 0
    @angularDrag = 0
    !MODULE[ModuleControlSurface] {}
    %MODULE[FARControllableSurface]
    {
        %b_2 = 3.165
        %MAC = 2.585
        %TaperRatio = 0.31
        %MidChordSweep = 41.1
        %nonSideAttach = 1
        %maxdeflect = 20
        %ctrlSurfFrac = 0.3
        %transformName = SpXwing3flap
    }
}
