		#loc_KUM_kumRequiredUav_title = KSC上空的未知飞行器
		#loc_KUM_kumRequiredUav_desc = 一架不明飞行器近期侵犯了KSC空域，为了我们行动的安全，你必须识别并摧毁这架入侵飞行器。
		#loc_KUM_kumRequiredUav_synopsis = 识别飞行器并将其击落。
		#loc_KUM_kumRequiredUav_completed = 任务完成！这是一次相当可疑的入侵，我们将检查编队日志，然后向你通报情况。

		#loc_KUM_kumAerialBadlands1_title = 荒地空中群组拦截
		#loc_KUM_kumAerialBadlands1_desc = 在我们设施遭受袭击后，我们检查了飞行日志，发现敌方活动始终可以追溯到荒地。据报道，该地区是敌方单位的温床，我们打算在该地区进行侦察，因此你必须处理掉这些单位。\n拦截并摧毁当地的空中力量，为我们的侦察单位清出道路。
		#loc_KUM_kumAerialBadlands1_synopsis = 拦截敌方单位，以便我们在荒地的行动能够开始。
		#loc_KUM_kumAerialBadlands1_completed = 任务完成！我们已经开始了行动，但存在一些问题，请等待我们稍后的通知。

		#loc_KUM_kumAerialBadlands2_title = 荒地清剿行动
		#loc_KUM_kumAerialBadlands2_desc = 在我们上次行动之后，敌方力量派遣了大量飞行器前往荒地空域巡逻，这严重阻碍了我们在该地区的行动。因此，你必须清剿剩余的敌方力量，为我们在该地区继续进行的空中、地面和海上行动扫清道路。\n解决敌军，清空空域，让我们能够继续驻扎于此！
		#loc_KUM_kumAerialBadlands2_synopsis = 清剿荒地地区的敌方力量，以便我们的行动能继续进行。
		#loc_KUM_kumAerialBadlands2_completed = 任务完成！我们的行动现在可以不受干扰地继续进行一段时间，而且我们的侦察队有情报要分享。

		#loc_KUM_kumAerialBadlandsPlains1_title = 巡逻荒地东部平原
		#loc_KUM_kumAerialBadlandsPlains1_desc = 总部要求对荒地以东的平原进行巡逻，似乎在该地区发现了一些敌方飞行器，必须予以处理。\n本次任务距离我们的设施很远，务必带足燃料，并尽快解决敌人。
		#loc_KUM_kumAerialBadlandsPlains1_synopsis = 巡逻荒地上空及东部平原，处理该地区的敌方飞行器。
		#loc_KUM_kumAerialBadlandsPlains1_completed = 任务完成！你已被批准返回基地。

		#loc_KUM_kumAerialBadlandsSteppe1_title = 荒地草原战斗空中巡逻
		#loc_KUM_kumAerialBadlandsSteppe1_desc = 在荒地以西的草原上发现了敌方单位，该地区靠近我们的一些设施。因此，你的任务是在该地区进行战斗空中巡逻，处理任何存在的单位。\n务必带足燃料；若不及时解决，这些敌人将对我们构成严重威胁。
		#loc_KUM_kumAerialBadlandsSteppe1_synopsis = 在荒地上空及西部草原进行战斗空中巡逻。
		#loc_KUM_kumAerialBadlandsSteppe1_completed = 任务完成！敌方已被清除，我们的设施不再受到它们的威胁。

		#loc_KUM_kumAerialBadLake1_title = 荒地附近的海上交战
		#loc_KUM_kumAerialBadLake1_desc = 敌军已在荒地附近集结其海军力量，最近他们派遣了一支飞行器编队巡逻该空域。\n该地区对我们极具价值，据信那里有敌方的一处主要设施；因此你必须处理掉这些单位，以便我们的侦察队对该地区进行勘察。
		#loc_KUM_kumAerialBadLake1_synopsis = 在荒地附近与一支敌方海军飞行器编队交战。
		#loc_KUM_kumAerialBadLake1_completed = 任务完成！我们的侦察队即将出发，为下一个任务做好准备。

		#loc_KUM_kumAerialBadLake2_title = 荒地海军压制
		#loc_KUM_kumAerialBadLake2_desc = 我们在荒地附近的侦察任务发现了几个感兴趣的地点，其中一些有部队移动的痕迹。我们必须继续在该地区的行动以发现他们的设施，然而敌人一直保持着在该地区的持续空中存在。\n我们需要摧毁这些空中单位，为我们的行动创造机会窗口——这正是需要你出马的地方。
		#loc_KUM_kumAerialBadLake2_synopsis = 消灭敌方飞行器，为我们的侦察行动打开机会窗口。
		#loc_KUM_kumAerialBadLake2_completed = 任务完成！侦察机和侦察兵已开始在该地区行动。

		#loc_KUM_kumAerialDessertAssault1_title = 中断对沙漠航天港的突袭
		#loc_KUM_kumAerialDessertAssault1_desc = 敌人组建了一个由数架飞行器组成的攻击群，目前正待命攻击沙漠航天港。\n我们不能允许他们的行动得逞，你必须拦截这支敌军并消灭所有单位。\n\n动用一切可用装备，摧毁敌人！
		#loc_KUM_kumAerialDessertAssault1_synopsis = 阻止敌方群组对沙漠航天港的突袭准备。
		#loc_KUM_kumAerialDessertAssault1_completed = 任务完成！他们的突袭被挫败，我们可以重新集结，准备我们自己的反击。

		#loc_KUM_kumAerialDessertGradient1_title = 沙漠斜坡空中支援清除
		#loc_KUM_kumAerialDessertGradient1_desc = 在最近对Kerbin沙漠地区的突袭之后，敌方地面单位在斜坡附近伏击了我们的部队。在这次伏击中，空中单位一直在校正炮火并提供近距离空中支援。因此，我们需要你协助摧毁他们的资产。
		#loc_KUM_kumAerialDessertGradient1_synopsis = 摧毁敌方空中支援单位。
		#loc_KUM_kumAerialDessertGradient1_completed = 任务完成！多亏了你，我们的力量得以从该地区撤退。

		#loc_KUM_kumAerialCraterSea1_title = 环形山海上的海军巡逻
		#loc_KUM_kumAerialCraterSea1_desc = 在大陨石坑以西，我们观察到一次大规模的海军巡逻，这可能对该地区的行动构成威胁。因此，我们要求击落这些飞行器。负责该行动的单位至今未归。\n摧毁敌方飞行器，以便我们搜寻上次行动的幸存者。
		#loc_KUM_kumAerialCraterSea1_synopsis = 摧毁敌方飞行器以支援搜救行动。
		#loc_KUM_kumAerialCraterSea1_completed = 任务完成！搜救队已派出，返回基地进行汇报。

		#loc_KUM_kumAerialIsland1_title = KSC东部岛屿入侵
		#loc_KUM_kumAerialIsland1_desc = 敌人对KSC正东半岛附近的岛屿发动了入侵，似乎是空中单位在支援该地区的海军行动。摧毁这些单位，夺回该地区的空域。我们将进行空中侦察，定位该地区的任何地面资产和设施。
		#loc_KUM_kumAerialIsland1_synopsis = 摧毁支援东部岛屿地区海军行动的飞行器。
		#loc_KUM_kumAerialIsland1_completed = 任务完成！侦察队已定位到一些设施，返回基地接受下一个任务。

		#loc_KUM_kumAerialIsland2_title = 敌方岛屿占领部队
		#loc_KUM_kumAerialIsland2_desc = 荒地附近的一个岛屿最近被敌方力量占领，这个岛屿是建立一个前哨以支援对其当地力量入侵的理想地点，因此在该地区观察到定期巡逻。我们正准备对该地区进行一次侦察行动以定位他们的设施。为了确保这次行动的成功，你必须摧毁该地区所有敌方飞行器。
		#loc_KUM_kumAerialIsland2_synopsis = 支援对敌方占领岛屿上空的侦察行动。
		#loc_KUM_kumAerialIsland2_completed = 任务完成！侦察单位已在该地区监视地形。

		#loc_KUM_kumAerialK7R1_title = K7R空域交战
		#loc_KUM_kumAerialK7R1_desc = 总部已下达侦察任务命令，因为我们正在搜寻敌方的主要行动基地。\n在本次任务中，我们探测到 K7R 空域上方有大量空中力量。你的任务就是飞过去，把它们全部击落。\n\n这将是一场艰难的交战，检验你技术的时刻到了。
		#loc_KUM_kumAerialK7R1_synopsis = 在K7R空域消灭一大群敌方飞行器。
		#loc_KUM_kumAerialK7R1_completed = 任务完成！现在空域已清空，我们可以进行下一个行动了。

		#loc_KUM_kumAerialK7ROutpost1_title = K7R前哨空域交战
		#loc_KUM_kumAerialK7ROutpost1_desc = 在我们上次飞越 K7R 空域时，一架侦察机发现了一个敌方前哨，他们似乎正在集结部队以攻击我们的沙漠设施。\n该机还报告有大量敌军在巡逻该空域，不得不撤离以避免被击落。
		#loc_KUM_kumAerialK7ROutpost1_synopsis = 在K7R前哨上空消灭一群敌方飞行器。
		#loc_KUM_kumAerialK7ROutpost1_completed = 任务完成！既然空域已清空，摧毁前哨将容易得多。

		#loc_KUM_kumAerialKerbalonPixy_title = Kerbalon河附近的敌对目标
		#loc_KUM_kumAerialKerbalonPixy_desc = 一架原型战斗机最近被盗，我们在 Kerbalon 河附近探测到一架 RCS 信号匹配的飞行器。\n该机装备有特殊武器，注意它的脉冲导弹和定向能武器。\n你必须从河道方向接近该机以保持隐蔽，然后与之展开空战。\n\n我们绝不能容忍这架飞机被盗，摧毁它。
		#loc_KUM_kumAerialKerbalonPixy_synopsis = 摧毁Kerbalon河附近被盗的飞行器。
		#loc_KUM_kumAerialKerbalonPixy_completed = 任务完成！原型机已被成功摧毁，我们已经安排了与你的飞行员会面，放心，他会没事的。

		#loc_KUM_kumAerialKerbalonPlains1_title = Kerbalon平原上空的巡逻拦截
		#loc_KUM_kumAerialKerbalonPlains1_desc = 最高指挥部命令你在 Kerbalon 空域拦截一支敌方巡逻队。一项行动即将展开，因此保持这些平原上空空域畅通至关重要。附近有敌军前哨，提防该地区的 SAM 阵地和高射炮阵地。
