		#loc_KUM_kumTestSatellite1_synopsis = 在摧毁目标卫星的同时测试一些硬件。
		#loc_KUM_kumTestSatellite1_completed = 成功！我们设施的工作人员对数据欣喜若狂！

		#loc_KUM_kumTestStatic1_title = 摧毁静态目标
		#loc_KUM_kumTestStatic1_desc = 我们最近注意到仓库里有许多武器闲置，有些我们甚至无法确认是否还能使用，这就需要你出场了。
		#loc_KUM_kumTestStatic1_synopsis = 在摧毁静态目标的同时测试一些硬件。
		#loc_KUM_kumTestStatic1_completed = 成功！我们设施的工作人员对数据欣喜若狂！

		#loc_KUM_kumTestSubmarine1_title = 摧毁潜艇目标
		#loc_KUM_kumTestSubmarine1_desc = 我们最近注意到仓库里有许多武器闲置，有些我们甚至无法确认是否还能使用，这就需要你出场了。
		#loc_KUM_kumTestSubmarine1_synopsis = 在摧毁潜艇目标的同时测试一些硬件。
		#loc_KUM_kumTestSubmarine1_completed = 成功！我们设施的工作人员对数据欣喜若狂！

		// Ground

		#loc_KUM_kumGroundRequired_title = KSC 以西的炮兵阵地
		#loc_KUM_kumGroundRequired_desc = 我们在 KSC 以西发现两门固定部署的火炮，它们没有任何识别标志，必须由你处理。\n接近并摧毁它们——虽然固定不动，但它们对 KSC 构成严重威胁。\n\n用任何必要手段摧毁这些火炮。
		#loc_KUM_kumGroundRequired_synopsis = 接近并摧毁固定部署的火炮。
		#loc_KUM_kumGroundRequired_completed = 任务完成！敌方火炮已被摧毁。

		#loc_KUM_kumGroundCraterRim1_title = 陨石坑边缘防空清剿
		#loc_KUM_kumGroundCraterRim1_desc = 我们在沙漠机场以西的陨石坑边缘发现大量敌方 SAM 阵地，这严重打乱了瓦伦蒂娜的休假计划。你必须前往那里，将它们全部消灭。\n\n为了我们的假期，拿下这个地点！
		#loc_KUM_kumGroundCraterRim1_synopsis = 摧毁陨石坑边缘地区的全部 SAM 阵地。
		#loc_KUM_kumGroundCraterRim1_completed = 任务完成！瓦伦蒂娜的假期保住了。

		#loc_KUM_kumGroundIslandAirfield1_title = 阻止岛屿机场被占领
		#loc_KUM_kumGroundIslandAirfield1_desc = 最近，敌军在 KSC 以东岛屿的机场部署了多个海岸炮阵地，我们还确认了防空武器的存在。\n这威胁到 KSC 以及未来的发射，因此必须处理这些单位。\n\n用任何必要手段夺回该区域。
		#loc_KUM_kumGroundIslandAirfield1_synopsis = 摧毁岛屿机场内的全部敌军并夺回机场。
		#loc_KUM_kumGroundIslandAirfield1_completed = 任务完成！岛屿机场已成功清空。

		#loc_KUM_kumGroundKSCPlains1_title = KSC 平原敌军巡逻队清剿
		#loc_KUM_kumGroundKSCPlains1_desc = 目前局势正在升级，多支敌军正从西面接近 KSC。他们正在 KSC 平原巡逻，随后就会转向我们的设施。\n在他们抵达 KSC 之前拦截并摧毁这些单位。
		#loc_KUM_kumGroundKSCPlains1_synopsis = 阻止正在接近 KSC 的巡逻队。
		#loc_KUM_kumGroundKSCPlains1_completed = 任务完成！敌军巡逻队已被成功拦截。

		// Ground FOB

		#loc_KUM_kumGroundFobBadlandsSteppe1_title = 摧毁荒地草原前进基地
		#loc_KUM_kumGroundFobBadlandsSteppe1_desc = 我们注意到敌方在荒地草原的坡地上部署了一个前进作战基地（FOB）。这个敌方基地离我们的战区太近，绝不能容忍。\n立即用任何手段摧毁该前哨，但要小心，该地区报告有敌方防空火力和固定火炮。
		#loc_KUM_kumGroundFobBadlandsSteppe1_synopsis = 找到并摧毁荒地草原坡地上的敌方前进基地。
		#loc_KUM_kumGroundFobBadlandsSteppe1_completed = 任务完成！该区域已成功夺回，附近的行动已经恢复。

		#loc_KUM_kumGroundFobKSCAssault1_title = 摧毁 KSC 突击前进基地
		#loc_KUM_kumGroundFobKSCAssault1_desc = 最近，我们在 KSC 西北方向发现了一个前哨基地，它与被派去袭击 KSC 的空中突击群一同出现。\n该前哨支援敌方突击行动，必须立即摧毁。\n尽快接近并摧毁该前哨，它对我们行动构成严重威胁，绝不能容忍！\n摧毁敌方前哨，再次确保 Kerbin 不受其部队威胁！
		#loc_KUM_kumGroundFobKSCAssault1_synopsis = 摧毁支援 KSC 突击行动的前进基地。
		#loc_KUM_kumGroundFobKSCAssault1_completed = 任务完成！敌方基地已摧毁，当地敌军行动已瘫痪！

		#loc_KUM_kumGroundFobKSCPlains1_title = KSC 平原上的前哨
		#loc_KUM_kumGroundFobKSCPlains1_desc = 我们在 KSC 以西发现了一个离 KSC 危险地近的前进作战基地。\n我们的侦察车最近在该地区被击落，因此只能由你来处理。\n\n接近该区域并制止他们的行动。
		#loc_KUM_kumGroundFobKSCPlains1_synopsis = 接近并摧毁离 KSC 危险地近的前进基地。
		#loc_KUM_kumGroundFobKSCPlains1_completed = 任务完成！平原再次清空，我们的空域也已为本地行动恢复安全。

		#loc_KUM_kumGroundFobKscSea1_title = 摧毁 KSC 以东岛屿上的前进基地
		#loc_KUM_kumGroundFobKscSea1_desc = 最近在 KSC 以东、旧机场之后的岛屿上发现了另一个前进基地。它离 KSC 海域太近，是必须处理的严重威胁。\n接近敌方基地并尽快摧毁它，但要注意，它由多套地对空和地对地系统保护。
		#loc_KUM_kumGroundFobKscSea1_synopsis = 消灭 KSC 以东岛屿上的敌方前进基地。
		#loc_KUM_kumGroundFobKscSea1_completed = 任务完成！我们的近海空域已清空，区域再次安全。

		#loc_KUM_kumGroundFobSouthStrait1_title = 摧毁南部海峡附近的前进基地
		#loc_KUM_kumGroundFobSouthStrait1_desc = 我们锁定了敌方一处基地！情报指向南部冰架附近的海峡。建议多带几层保暖衣物。\n摧毁敌方前哨，再次确保 Kerbin 不受其部队威胁！\n\n另请注意，该地区此前也出现过敌方空中单位。
		#loc_KUM_kumGroundFobSouthStrait1_synopsis = 摧毁南部冰架附近海峡中的敌方基地。
		#loc_KUM_kumGroundFobSouthStrait1_completed = 任务完成！南部海峡已控制，我们可以恢复该地区的地面行动。

		#loc_KUM_kumGroundFobWaterfallMountains1_title = 摧毁瀑布山脉中的前进基地
		#loc_KUM_kumGroundFobWaterfallMountains1_desc = 敌方一处基地被定位在 KSC 东北方、东部半岛的瀑布山脉中。这里海拔较高，记得为你的进气口做好准备。\n摧毁这里的敌人是确保我方地面部队能够推进该地区的优先事项，我们全靠你了。
		#loc_KUM_kumGroundFobWaterfallMountains1_synopsis = 消灭 KSC 东北方瀑布山脉中的敌方前哨。
		#loc_KUM_kumGroundFobWaterfallMountains1_completed = 任务完成！该地区地面行动已恢复，我方地面部队向你致意。

		// Naval

		#loc_KUM_kumNavalRequired_title = KSC 东南的巡逻艇
		#loc_KUM_kumNavalRequired_desc = 在 KSC 东南方向发现两艘不明巡逻艇，它们正在该地区阻断航运，必须处理。\n如果可能，请接近这些舰艇，以便我们收集其型号和来源情报。\n\n授权你采取任何必要手段摧毁这些舰艇。
		#loc_KUM_kumNavalRequired_synopsis = 分析巡逻艇并制止其行动。
		#loc_KUM_kumNavalRequired_completed = 任务完成！该区域已安全。

		#loc_KUM_kumNavalIslandAirfield1_title = 岛屿机场附近的海上增援
		#loc_KUM_kumNavalIslandAirfield1_desc = 我们在 KSC 以东的岛屿机场附近发现少量巡逻艇。最近一次侦察飞行遭到射击，报告发现 4 个目标。\n这些舰艇武器较轻，但仍威胁我们的设施。\n\n摧毁它们，夺回我们的海域！
		#loc_KUM_kumNavalIslandAirfield1_synopsis = 摧毁岛屿机场附近的海上增援。
		#loc_KUM_kumNavalIslandAirfield1_completed = 任务完成！机场区域的海上威胁已清除。

		//Space

		#loc_KUM_kumSpaceRequired_title = 监视卫星
		#loc_KUM_kumSpaceRequired_desc = 最近跟踪到一颗无武装监视卫星，我们确认它携带大型天线，很可能用于信号情报。接近目标，检查并摧毁它。
		#loc_KUM_kumSpaceRequired_synopsis = 摧毁轨道上的信号情报卫星。
		#loc_KUM_kumSpaceRequired_completed = 任务完成！我们已截获敌方通信网络，预计很快会有更多发现。

		#loc_KUM_kumSpaceSatellite1_title = 敌方卫星
		#loc_KUM_kumSpaceSatellite1_desc = 最近跟踪到一颗可能武装的敌方监视卫星。它维持着敌方的通信网络，并对所在轨道平面内的任何飞行器构成严重威胁，因此必须立即处理。\n\n摧毁这枚敌方信号情报卫星。
		#loc_KUM_kumSpaceSatellite1_synopsis = 摧毁轨道上的敌方卫星。
		#loc_KUM_kumSpaceSatellite1_completed = 任务完成！该轨道平面已清空。

		#loc_KUM_kumSpaceEkv1_title = 故障的外大气层拦截器
		#loc_KUM_kumSpaceEkv1_desc = 一枚敌方外大气层拦截器最近在武器测试中发生故障。鉴于其在太空中的存在性质，必须立即处理。\n\n该单位会攻击任何接近它的目标，摧毁它时务必极度小心。
		#loc_KUM_kumSpaceEkv1_synopsis = 摧毁轨道上故障的外大气层拦截器。
		#loc_KUM_kumSpaceEkv1_completed = 任务完成！威胁已消除，行动可以恢复。
	}
