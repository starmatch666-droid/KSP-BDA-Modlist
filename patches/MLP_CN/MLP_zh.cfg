// ============================================================================
//  Modular Launch Pads（AlphaMensae's Modular Launch Pads）简体中文补丁
//  汉化：ModuleManager 补丁，只改文本，不动任何数值
//  本文件覆盖：
//    1) 编辑器分类名（CCK 分类 + 自定义零件列表分类与 12 个子分类）
//    2) 厂商名（Alphadyne Construction Group / Alphadyne Crane Systems）
//    3) 233 个零件的 title
//    4) 右键菜单动作文本（摆臂/脐带/升降机/压紧装置/龙门/勤务塔等 100 组）
//  说明（description）为单独一批，见同目录 MLP_desc_zh.cfg（如有）
// ============================================================================


// ============================================================================
//  一、编辑器分类名
// ============================================================================

@CCKExtraFilterConfig
{
	@Item:HAS[#tag[cck-modularlaunchpads]]
	{
		@name = 模块化发射台
		@usedByMod = 模块化发射台
	}
}

@CUSTOM_PARTLIST_CATEGORY:HAS[#categoryName[Modular?Launch?Pads]]
{
	@categoryName = 模块化发射台

	@SUBCATEGORY:HAS[#categoryName[Launch?Stands]]
	{
		@categoryName = 发射台架
	}
	@SUBCATEGORY:HAS[#categoryName[Launch?Plates]]
	{
		@categoryName = 发射底板
	}
	@SUBCATEGORY:HAS[#categoryName[Launch?Rails]]
	{
		@categoryName = 发射导轨
	}
	@SUBCATEGORY:HAS[#categoryName[Launch?Bases]]
	{
		@categoryName = 发射基座
	}
	@SUBCATEGORY:HAS[#categoryName[General?Service?Towers]]
	{
		@categoryName = 通用勤务塔
	}
	@SUBCATEGORY:HAS[#categoryName[Special?Service?Towers]]
	{
		@categoryName = 专用勤务塔
	}
	@SUBCATEGORY:HAS[#categoryName[Crew?Elevators]]
	{
		@categoryName = 乘员升降机
	}
	@SUBCATEGORY:HAS[#categoryName[Hold?Downs]]
	{
		@categoryName = 压紧装置
	}
	@SUBCATEGORY:HAS[#categoryName[Swing?Arms?&?Umbilicals]]
	{
		@categoryName = 摆臂与脐带
	}
	@SUBCATEGORY:HAS[#categoryName[Soyuz?Launch?Base]]
	{
		@categoryName = 联盟号发射基座
	}
	@SUBCATEGORY:HAS[#categoryName[Saturn?V?Mobile?Launcher]]
	{
		@categoryName = 土星五号移动发射台
	}
	@SUBCATEGORY:HAS[#categoryName[Space?Shuttle?Launch?Platform]]
	{
		@categoryName = 航天飞机发射平台
	}
}


// ============================================================================
//  二、厂商名
// ============================================================================

@PART[*]:HAS[#manufacturer[Alphadyne?Construction?Group]]:FINAL
{
	@manufacturer = 阿尔法迪恩建造集团
}

@PART[*]:HAS[#manufacturer[Alphadyne?Crane?Systems]]:FINAL
{
	@manufacturer = 阿尔法迪恩起重系统
}


