// ============================================================================
//  Mk-33 驾驶舱 / 乘员模块：加生保资源槽      (KISA_Fixes / 2026-10-13)
// ----------------------------------------------------------------------------
//  背景：Mk-33 的 Mk33Cockpit（乘员 12）与 wbiMk33KrewModule（乘员 16）原本
//        只有燃料/氧化剂，没有生保资源槽，长航时乘员没法带补给。
//        你用的是 USI-LS，所以这里补 USI-LS 三件套 + 一点电容量。
//
//  容量：
//    Mk33Cockpit      Supplies 900 · Mulch 900 · Fertilizer 450 · EC +500
//    wbiMk33KrewModule Supplies 1200 · Mulch 1200 · Fertilizer 600 · EC +1000
//  参考换算（USI-LS）：1 Supplies ≈ 1 人日 → 驾驶舱 900 ≈ 12 人 75 天；
//                     乘员模块 1200 ≈ 16 人 75 天。想更宽/更抠改 maxAmount 即可。
//
//  只加"槽位"（新造零件装好后是空的，去 VAB 里加注或用补给船送）。
//  撤销：删掉本文件。
// ============================================================================

@PART[Mk33Cockpit]:NEEDS[USILifeSupport]:FINAL
{
	RESOURCE { name = Supplies    amount = 0  maxAmount = 900  }
	RESOURCE { name = Mulch       amount = 0  maxAmount = 900  }
	RESOURCE { name = Fertilizer  amount = 0  maxAmount = 450  }
	@RESOURCE[ElectricCharge]     { %maxAmount = 1500 }
}

@PART[wbiMk33KrewModule]:NEEDS[USILifeSupport]:FINAL
{
	RESOURCE { name = Supplies    amount = 0  maxAmount = 1200 }
	RESOURCE { name = Mulch       amount = 0  maxAmount = 1200 }
	RESOURCE { name = Fertilizer  amount = 0  maxAmount = 600  }
	@RESOURCE[ElectricCharge]     { %maxAmount = 1000 }
}
