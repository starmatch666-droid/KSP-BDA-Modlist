// ============================================================================
//  实验室只要求 1 名科学家（默认值）          (KISA_Fixes / 2026-10-12)
// ----------------------------------------------------------------------------
//  原因：部分 mod 的实验室（例如 StationPartsExpansionRedux 的
//        SDV-6 '德尔福'/Delphi 科学模块 sspx-lab-5-1）把 ModuleScienceLab 的
//        `crewsRequired` 调高到 2~3 人，导致只有一名科学家在场时无法开工。
//        原版移动实验室（LargeCrewedLab）用的是 `crewsRequired = 1`。
//
//  本补丁：把所有带 ModuleScienceLab 的零件的 `crewsRequired` 统一设成 1。
//          · 原版实验室本来就是 1，属无操作；
//          · 只动这一个字段，不影响数据处理速率/科学产出/电力消耗等。
//
//  撤销：删掉本文件即可。
// ============================================================================

@PART[*]:HAS[@MODULE[ModuleScienceLab]]:FINAL
{
	@MODULE[ModuleScienceLab]
	{
		%crewsRequired = 1
	}
}
