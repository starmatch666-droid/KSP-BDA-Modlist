// ============================================================================
//  让「所有对接口」都能焊接/合并            (KISA_Fixes / 2026-10-12)
// ----------------------------------------------------------------------------
//  背景：USI Konstruction 的焊接（Weld）默认只作用在它自带的三个
//        Clamp-O-Tron Construction Port（ConstructionPort0/1/2）上，
//        因为它们才有 ModuleWeldablePort 模块。原版和其它 mod 的对接口没有，
//        所以右键菜单里看不到 Weld。
//
//  本补丁：给**每一个带 ModuleDockingNode 的零件**补上 ModuleWeldablePort，
//          这样任何对接口对接后都能焊接合并 / 再 Unweld 拆开。
//          参数照抄 Konstruction 自带对接口的写法（name + portSnap = false）。
//
//  保护：
//    · :NEEDS[Konstruction] —— 没装 Konstruction 时整段不生效；
//    · &!MODULE[ModuleWeldablePort] —— 已经有这个模块的零件（Konstruction 自己的
//      对接口、以及其它 mod 已经做成可焊的端口）不会被重复添加；
//    · :FINAL —— 在所有其它补丁之后执行，避免被后来的补丁覆盖。
//
//  撤销：删掉本文件即可（已焊好的飞船不受影响，只是不再能对新的对接口焊接）。
//  注意：焊接/解焊是否需要工程师、是否消耗资源，由 Konstruction 自己决定；
//        焊接会把两艘飞船永久合并为一艘（对接口保留但不可分离）。
// ============================================================================

@PART[*]:HAS[@MODULE[ModuleDockingNode]&!MODULE[ModuleWeldablePort]]:NEEDS[Konstruction]:FINAL
{
	MODULE
	{
		name = ModuleWeldablePort
		portSnap = false
	}
}
