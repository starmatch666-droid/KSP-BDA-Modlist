// ============================================================================
//  删除「土壤湿度传感器」系列零件        (KISA_Fixes / 2026-10-12)
// ----------------------------------------------------------------------------
//  原因（你游戏里 Tinygrox 的 ZZZ_Fix_US2SoilMoistureCTD.cfg 里已有说明）：
//    CommNetAntennasConsumptor 会给所有带 ModuleDataTransmitter 的零件注入
//    ModuleAntennaToggler，并在 ModuleDataTransmitter 上写 DeployFxModules = 1。
//    它的排除列表只有 !MODULE[DMSoilMoisture]（独立版），漏掉了
//    US2 楔子版的模块名 DMUniversalStorageSoilMoisture
//    → 那个零件拿到一个指向不存在的“展开特效模块”的索引
//    → 在编辑器里点它、打开天线相关 UI 时空引用 → 闪退(CTD)。
//
//  本补丁做什么：把三个「土壤湿度传感器」零件从游戏里整体移除，
//    这样无论点哪个变体都不可能再触发这个崩溃。
//      dmSoilMoisture      DMagic 独立版
//      dmUSSoilMoisture    Universal Storage 1 楔子版
//      dmUS2SoilMoisture   Universal Storage 2 楔子版
//
//  现状核对：当前存档里这三件都没被任何在飞的飞船使用（出现 0 次）。
//
//  想恢复：删掉本文件（或注释掉下面三行）重启即可。
//  想“不删零件、只治崩溃”：改用
//      @PART[dmUS2SoilMoisture]:FINAL { !MODULE[ModuleAntennaToggler] {} !MODULE[ModuleGeneratorAntenna] {} }
//    并给 CommNetAntennasConsumptor 的排除列表补上 !MODULE[DMUniversalStorageSoilMoisture]
// ============================================================================

!PART[dmSoilMoisture] {}
!PART[dmUSSoilMoisture] {}
!PART[dmUS2SoilMoisture] {}
