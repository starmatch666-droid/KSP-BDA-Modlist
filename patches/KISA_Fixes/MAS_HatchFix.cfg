// ============================================================================
//  MAS 舱门初始化报错修复        (KISA_Fixes / 2026-10-11)
// ----------------------------------------------------------------------------
//  症状（游戏内红字）：
//      [MAS航电系统]：初始化时抛出错误，检查信息日志。
//  日志实据：
//      [AvionicsSystems] INITIALIZATION ERROR: Failed to configure prop #16 (MAS_JSI_EVA_Hatch)
//      [MASComponent] System.ArgumentNullException: Value cannot be null.
//          Parameter name: Unable to find MASFlightComputer in part - please check part configs
//          at AvionicsSystems.MASComponent.Start ()
//
//  原因：
//      1) JSI 的 RPMPodPatches/PatchesStock/crew-cabin-patch.cfg 往 crewCabinInternals
//         里塞了一个 JSIEvaHatch（作用：在 IVA 里双击舱门直接出舱）。这个补丁的注释
//         明确写着“客舱不需要显示器”，所以它 **不给部件加 RasterPropMonitorComputer**。
//      2) MAS 的 000_JSI-To-MAS.cfg 在 FINAL 阶段把 JSIEvaHatch 改名成
//         MAS_JSI_EVA_Hatch，并换成 MASComponent（onClick = fc.CrewEva(-1)）。
//      3) MASComponent 要求同一个部件上有 MASFlightComputer。而 MAS 自己那条
//         “给 RPM 部件补飞控”的补丁是按 RasterPropMonitorComputer 匹配的，
//         客舱没有 RPM 电脑 → 匹配不到 → 出舱那个 prop 一初始化就抛异常。
//
//  修复：
//      凡是用了 crewCabinInternals、又还没有 MASFlightComputer 的部件，补一个飞控。
//      受影响的部件：原版 Hitchhiker 客舱(crewCabin)、SXT 的 SPKTR / SSP-10 / SSP-20 /
//      ISK-30 / CANIOT 客舱、USI 温室 Greenhouse_Inline、Endurance 的 ENhabEndurance
//      与 ENinfirmaryEndurance。
//
//  副作用：requiresPower = false —— 不额外耗电，也不参与断电停机；只是让那个舱门按钮
//          有飞控可调用。想撤销：删掉 KISA_Fixes 整个文件夹即可。
// ============================================================================

@PART[*]:HAS[@INTERNAL[crewCabinInternals]&!MODULE[MASFlightComputer]]:NEEDS[AvionicsSystems]:FINAL
{
	MODULE
	{
		name = MASFlightComputer
		requiresPower = false
		gLimit = 4.7
		baseDisruptionChance = 0.20
	}
}
