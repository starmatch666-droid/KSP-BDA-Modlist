// ============================================================================
//  移除 Endurance 船体 + 登陆舱（保留 Ranger / Viper / Ranger 系）  2026-10-13
// ----------------------------------------------------------------------------
//  用户决定：Endurance 飞船本体和登陆舱整体不要了；
//  Ranger（徘徊者）、Mini-Ranger（Viper）、Ranger 气尖引擎、两个 Ranger 对接口
//  以及配套内饰继续保留。
//
//  做法：模组文件夹 GameData\Endurance 原样不动（留下的零件还需要它里面的
//  贴图 / 模型 / 插件），这里只把不要的零件从游戏数据库里删掉 —— VAB 和科技树
//  里都不会再出现。
//
//  为什么是 :FINAL 而且文件名以 zz_ 开头：
//    别的补丁（Endurance_CN 汉化、VABOrganizer 分类等）在用 @PART[...] 引用这些
//    零件。ModuleManager 按配置路径顺序处理，本文件必须排在最后，才能保证删干净、
//    不会被后续补丁重新写出一个残缺的零件节点。
//
//  撤销：删掉本文件即可（零件的 cfg 一直都在模组里，没被动过）。
// ============================================================================

!PART[ENringEndurance|ENhabEndurance|ENcommandEndurance|ENcargoEndurance|ENcargoContainer|ENmountEndurance|ENinfirmaryEndurance|ENdeployableHabitat|ENdeployableLab|ENcargoScience|ENendSciBox|ENbox_small|ENcolonyflag|ENenduranceEngine|ENOuterDock125|ENOuterRangerDock125|ENlanderBody|ENlanderVTOL]:NEEDS[Endurance]:FINAL
{
}

// 登陆舱的座舱内饰（INTERNAL）只被 ENlanderBody 引用，随零件一起摘掉。
// 想留着的话，把下面这一段删掉即可。
!INTERNAL[EnduranceLander]:NEEDS[Endurance]:FINAL
{
}
