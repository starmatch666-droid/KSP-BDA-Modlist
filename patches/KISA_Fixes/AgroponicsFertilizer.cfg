// ============================================================================
//  SSPXR 温室（Agroponics）：大幅降低肥料消耗        (KISA_Fixes / 2026-10-14)
// ----------------------------------------------------------------------------
//  背景（数据全部来自 saves\KISA\persistent.sfs 里"美神号远征飞船"的实况）：
//    · 8 名乘员，回收器倍率 RecyclerMultiplier = 0.5（实验室 0.5/6 + 核心舱 0.25/5 封顶）
//    · 乘员产 Mulch 0.0005/s/人 ×0.5 = 0.002/s；补给消耗同样 0.002/s
//    · 船上 2×375 温室 + 1×125 温室，Agroponics 满负荷：吃 Mulch 0.00524/s、
//      产 Supplies 0.005764/s → 受 Mulch 限流跑 ≈38% 负荷，净 +10% 补给，
//      所以补给罐一直是满的（4624/4625）、Mulch 一直是 0（产多少吃多少）
//    · 但肥料是催化剂：满负荷 0.000524/s，实跑 ≈0.0002/s ≈ 17.3/天，
//      船上 3025 单位只能撑 ≈175 天 —— **这才是真正的续航天花板**
//      （之后的 26 天存粮就是那个窗口显示的"sup 26d"）
//
//  本补丁：把下列温室 Agroponics 的肥料比例全部 ÷5
//      0.00015  -> 0.00003     (sspx-greenhouse-25-1)
//      0.00025  -> 0.00005     (sspx-greenhouse-375-1)
//      0.00035  -> 0.00007     (sspx-greenhouse-5-1)
//      0.00030  -> 0.00006     (sspx-dome-greenhouse-5-1)
//      0.000024 -> 0.0000048   (sspx-cupola-greenhouse-125-1)
//  其它（Mulch 摄入、Supplies 产出、耗电）一律不动 → 闭环余量不变，
//  只是同样一罐肥料能撑 5 倍时间：≈175 天 -> ≈875 天（约 2.4 年）。
//
//  想更远：把 /= 5 改成 /= 10（≈4.8 年）；或整段不限量——把下面的
//  @Ratio 行换成  !INPUT_RESOURCE:HAS[#ResourceName[Fertilizer]] {}  （温室不再吃肥料）
//  注意：这是全局改动，所有 SSPXR 温室都受益。撤销：删掉本文件。
// ============================================================================

@PART[sspx-greenhouse-25-1|sspx-greenhouse-375-1|sspx-greenhouse-5-1|sspx-dome-greenhouse-5-1|sspx-cupola-greenhouse-125-1]:NEEDS[USILifeSupport]:FINAL
{
	@MODULE[USI_ConverterSwapOption]
	{
		@INPUT_RESOURCE:HAS[#ResourceName[Fertilizer]]
		{
			@Ratio /= 5
		}
	}
}
