// ============================================================================
//  VABOrganizer 分类修复          (KISA_Fixes / 2026-10-12)
// ----------------------------------------------------------------------------
//  背景：很多 mod 零件没有提供 VABOrganizer 归属，或（RealChute）把 category 设成 none，
//        于是这些零件会掉进各分类下的「杂项」，降落伞更是整个消失。
//  本文件按「零件自带模块 + 原版分类 + 推进剂/资源」为这些零件补上归属：
//    · 引擎按推进剂分到 液体燃料/喷气/螺旋桨/固体/单组元/离子/核 各子分类
//      （例：RetroFuture 的 Eddie 系列 ED051/125/250/399 → 液体燃料引擎）
//    · 降落伞统一回到「实用 → 降落伞」（RealChute 的 category=none 一并修掉）
//    · RCS / 天线 / 电池 / 太阳能 / 同位素电源 / 反应堆 / 钻头 / 灯 / 轮子 / 起落架 /
//      对接口 / 分离器 / 热防护 / 散热器 / 货舱 / 科学仪器 / 指令舱 等按模块归类
//  只影响没被其它补丁认领的零件；想撤销：删掉 KISA_Fixes 文件夹。
// ============================================================================

// ---- 本补丁新增的子分类（发射场工装：ModularLaunchPads 的发射台/塔架/摆臂）----
ORGANIZERSUBCATEGORY
{
	name = kisaLaunchStructures
	Label = #LOC_KISA_VABO_launchStructures
	Priority = 200
	CategoryPriority = 60
}

Localization
{
	en-us
	{
		#LOC_KISA_VABO_launchStructures = Launch Pad Structures
	}
	zh-cn
	{
		#LOC_KISA_VABO_launchStructures = 发射场工装 // Launch Pad Structures
	}
}

