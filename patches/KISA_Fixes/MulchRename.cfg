// ============================================================================
//  Mulch 中文名修正：护根 -> 残渣        (KISA_Fixes / 2026-10-12)
// ----------------------------------------------------------------------------
//  原因：CommunityResourcePack 的汉化把 Mulch 译成「护根」（园艺词 mulch = 覆盖
//        在土面上的护根物），但 USI-LS 里它其实是**乘员消耗补给后产生的有机废物**，
//        「护根」放在生保语境里完全看不懂。
//
//  本补丁：把 Mulch 的显示名改成「残渣」，两处一起改，确保所有 UI/资源列表一致：
//    1) 直接改资源定义的 displayName（不依赖本地化加载顺序，必定生效）；
//    2) 同时覆盖 CRP 的本地化键 #LOC_CRP_Mulch_DisplayName。
//
//  想换词（比如「有机废物」「废料」）：把下面两处「残渣」替换掉即可。
//  撤销：删掉本文件。
// ============================================================================

@RESOURCE_DEFINITION[Mulch]:FINAL
{
	%displayName = 残渣
}

Localization
{
	zh-cn
	{
		#LOC_CRP_Mulch_DisplayName = 残渣
	}
}
