// ---------- 仅 USI-LS 自身的可切换舱位 ----------
// 不要用 @PART[*]，否则会覆盖 KPBS 的 Converter 1/2 等多个舱位名。
@PART[USILS_ViewingCupola|USILS_SmCupola|USILS_Greenhouse_MiniCupola|USILS_Greenhouse_Cupola|USILS_Greenhouse_Inline|USILS_Recycler|USILS_LgRecycler|LifeSupportMiniPack|FertilizerMiniPack|MulchMiniPack]:HAS[@MODULE[USI_SwappableBay]]
{
	@MODULE[USI_SwappableBay]
	{
		@bayName = 设备舱 1
	}
}
