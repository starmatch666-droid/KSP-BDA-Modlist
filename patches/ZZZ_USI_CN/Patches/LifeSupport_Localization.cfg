// USI-LS 的部件标题/描述是硬编码在 cfg 里的，这里统一接到本地化键。
// 同时把生命保障模块在 PAW 里显示的转换器名称改成中文。

// ---------- 观景/居住穹顶 ----------
@PART[USILS_ViewingCupola]
{
	%title = #LOC_USI_LS_ViewingCupola_title
	%manufacturer = #LOC_USI_LifeSupport_manufacturer
	%description = #LOC_USI_LS_ViewingCupola_desc

	@MODULE[USILS_HabitationSwapOption]
	{
		@ConverterName = 居住舱
		@StartActionName = 启用居住舱
		@StopActionName = 停用居住舱
	}
}

@PART[USILS_SmCupola]
{
	%title = #LOC_USI_LS_SmCupola_title
	%manufacturer = #LOC_USI_LifeSupport_manufacturer
