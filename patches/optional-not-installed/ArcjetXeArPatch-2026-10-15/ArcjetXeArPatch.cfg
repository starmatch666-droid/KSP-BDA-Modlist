// ============================================================================
//  ArcjetXeArPatch
//  Adds Xenon / Argon propellant modes to the FFT arcjet RCS family
//  (ARC-L = fft-rcs-arcjet-large-1,  ARC-mu = fft-rcs-arcjet-1).
//
//  Why: the stock FFT switcher only offers Lithium and Hydrogen, so an arcjet
//  RCS cannot share tanks with plasma / ion propulsion (NearFuturePropulsion:
//  PIT / VASIMR / MPD / Hall run on ArgonGas, ion + gridded run on XenonGas).
//  Xenon and Argon are also storable gases -> no cryo boil-off like LqdHydrogen.
//
//  Balance: Isp is anchored on the mod's own Hydrogen figure with Isp ~ 1/sqrt(M)
//      Ar (M=40)  : 2000 * sqrt(2/40)  =  447  -> 450 (large), 400 (small)
//      Xe (M=131) : 2000 * sqrt(2/131) =  247  -> 250 (large), 220 (small)
//  Electricity per unit of thrust is kept identical to the Lithium mode
//  (EC = EC_Lithium * thrusterPower / thrusterPower_Lithium), because the arc
//  power per unit thrust is roughly propellant independent. A lower Isp means a
//  higher mass flow for the same thrust, so the raw EC/second ends up much
//  higher than Lithium - that is intended, these are "heavy gas" modes.
//
//  Nothing in the original mod is modified: delete this folder to revert.
// ============================================================================

@PART[fft-rcs-arcjet-large-1]:AFTER[FarFutureTechnologies]      // ARC-L
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[RCSFuel]]
	{
		SUBTYPE
		{
			name = Argon
			title = #LOC_ARCJETXEAR_argon_title
			primaryColor = #b9a6ff
			descriptionDetail = #LOC_ARCJETXEAR_argon_detail
			descriptionSummary = #LOC_ARCJETXEAR_argon_summary
			transform = RCSLi
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = 11
					resourceName = ArgonGas
					PROPELLANT
					{
						name = ArgonGas
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					PROPELLANT
					{
						name = ElectricCharge
						ratio = 0.0715689
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = 0 450
						key = 1 100
						key = 4 0.001
					}
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleWaterfallFX
				}
				DATA
				{
					TEMPLATE
					{
						templateName = fft-waterfall-arcjet-h2-1
						overrideParentTransform = thrustVector
						scale = 1, 1, 1
						rotation = 0,0,0
						position = 0,0,0
					}
				}
			}
		}
		SUBTYPE
		{
			name = Xenon
			title = #LOC_ARCJETXEAR_xenon_title
			primaryColor = #8fc7ff
			descriptionDetail = #LOC_ARCJETXEAR_xenon_detail
			descriptionSummary = #LOC_ARCJETXEAR_xenon_summary
			transform = RCSLi
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = 12
					resourceName = XenonGas
					PROPELLANT
					{
						name = XenonGas
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					PROPELLANT
					{
						name = ElectricCharge
						ratio = 2.04310
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = 0 250
						key = 1 100
						key = 4 0.001
					}
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleWaterfallFX
				}
				DATA
				{
					TEMPLATE
					{
						templateName = fft-waterfall-arcjet-h2-1
						overrideParentTransform = thrustVector
						scale = 1, 1, 1
						rotation = 0,0,0
						position = 0,0,0
					}
				}
			}
		}
	}
}

