Localization
{
	en-us
	{
		#LOC_ARCJETXEAR_argon_title = Argon
		#LOC_ARCJETXEAR_argon_summary = Same propellant as plasma thrusters (PIT / VASIMR / MPD / Hall). One tank serves both, and argon is storable - no cryogenic boil-off like liquid hydrogen. The price is a much lower Isp and a much higher power draw per kN.
		#LOC_ARCJETXEAR_argon_detail = Runs the arcjet on argon. Argon's higher molar mass drops the vacuum Isp to roughly 400-450 s and raises thrust slightly, but a lower Isp means a higher mass flow for the same thrust, so the arc has to supply more power: electricity per kN is higher than the lithium mode. The real win is logistics - the whole vessel can share one propellant with plasma engines (PIT / VASIMR / MPD / Hall) instead of carrying a separate cryogenic hydrogen or lithium system.

		#LOC_ARCJETXEAR_xenon_title = Xenon
		#LOC_ARCJETXEAR_xenon_summary = Same propellant as ion and gridded ion thrusters. One tank serves both and xenon is storable; the lowest Isp of the three options and the highest power draw per kN.
		#LOC_ARCJETXEAR_xenon_detail = Runs the arcjet on xenon. Xenon has the highest molar mass here, so the vacuum Isp drops to roughly 220-250 s - the bluntest thrust-per-watt of the three propellants. It suits deep-space vessels that already carry xenon for ion propulsion: attitude control and main propulsion then share a single propellant, with no separate hydrogen or lithium supply.
	}
}
