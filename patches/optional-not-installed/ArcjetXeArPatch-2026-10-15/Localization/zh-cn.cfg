Localization
{
	zh-cn
	{
		#LOC_ARCJETXEAR_argon_title = 氩气 (Argon)
		#LOC_ARCJETXEAR_argon_summary = 与等离子推进器同源：PIT／VASIMR／MPD／霍尔都用氩气。共用一种贮箱，且氩气可常温储存、不像液氢那样蒸发；代价是比冲大幅下降、单位推力电耗更高。
		#LOC_ARCJETXEAR_argon_detail = 把电弧加热器的工质换成氩气。氩的分子量比氢和锂大，比冲降到真空约 400~450 秒，推力略微提高，但因为比冲低、同样推力下质量流量更大，需要更多电弧功率，所以每千牛电耗高于锂模式。它的价值不在性能，而在后勤：整艘飞船可以和等离子发动机（PIT／VASIMR／MPD／霍尔）共用同一种推进剂，省掉一整套低温液氢（或锂）系统。

		#LOC_ARCJETXEAR_xenon_title = 氙气 (Xenon)
		#LOC_ARCJETXEAR_xenon_summary = 与离子／格栅离子推进器同源（都用氙气）：共用贮箱、可常温储存；比冲比氩气模式更低，单位推力电耗最高。
		#LOC_ARCJETXEAR_xenon_detail = 把电弧加热器的工质换成氙气。氙的分子量最大，比冲进一步下降（真空约 220~250 秒），是三种工质里推力/电耗最"粗"的一档。适合已经为离子推进器带了氙气贮箱的深空飞船：姿控和主推进共用一种推进剂，不用再单独带氢或锂。
	}
}
