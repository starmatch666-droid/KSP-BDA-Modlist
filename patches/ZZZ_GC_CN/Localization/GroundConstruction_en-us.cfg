Localization
{
	en-us
	{
		#LOC_GC_manufacturer = AT Industries

		#LOC_GC_DIYKit_title = Ground Kit Container
		#LOC_GC_DIYKit_desc = DIY Kit is a pack of all the needed tools, blueprints and hightech components needed to build a vessel offworld. Provided that you have enough raw materials, a workshop and a powersupply already in place.

		#LOC_GC_OrbitalKitContainer_title = Dockable Kit Container
		#LOC_GC_OrbitalKitContainer_desc = DIY Kit is a pack of all the tools, blueprints and hightech components needed to build a vessel offworld. Provided that you have enough raw materials, a workshop and a powersupply already in place. This container is meant for orbital construction. It has a builtin docking port for external access.

		#LOC_GC_MagneticFork_title = Magnetic Forklift
		#LOC_GC_MagneticFork_desc = Allows precise manipulation of arbitrary objects with AI-controlled magnetic field

		#LOC_GC_SpaceCrane_title = SpaceCrane
		#LOC_GC_SpaceCrane_desc = This contraption combines a decent probe core, reaction wheel, RCS thrusters, batteries, fuel cells, fuel tanks and four nods to attach engines. Basically, its a one-piece sapceship made for a single purpouse of hauling cargo crates from one planet to another.

		#LOC_GC_GroundAssemblyLine_title = Ground Assembly Line
		#LOC_GC_GroundAssemblyLine_desc = Small but extremely high-tech factory that can produce DIY Kits practically out of nothing. Provided you have enough resources, energy and qualified engeneers onboard, of course. Comes with its own assembly space.

		#LOC_GC_InlineGroundWorkshop_title = Inline Workshop
		#LOC_GC_InlineGroundWorkshop_desc = This tin can has just enough room and equimpent for building, even if painfully slow, a nearby DIY Kit.

		#LOC_GC_MobileWorkshop_title = Mobile Workshop
		#LOC_GC_MobileWorkshop_desc = This heavy-duty vehicle have enought space and equipped with everything that is needed to build anything, provided you have appropriate DIY Kit lying around.

		#LOC_GC_OrbitalAssemblyLine_title = Orbital Assembly Line
		#LOC_GC_OrbitalAssemblyLine_desc = This state of the art factory is designed specificaly for zero-G conditions. It can rapidly produce everything required to assemble a new DIY Kit, but it requires an assembly space to hold the container.

		#LOC_GC_OrbitalAssemblySpace_title = Orbital Assembly Space
		#LOC_GC_OrbitalAssemblySpace_desc = This shielded compartment is ideal to store a container during DIY Kit assembly. It is also equipped with the Magnetic Damper that immobilize the container, preventing costly equipment from being broken and kerbals from being injured by stuff flying around.

		#LOC_GC_OrbitalWorkshop_title = Orbital Workshop
		#LOC_GC_OrbitalWorkshop_desc = A full-fledged zero-g workshop with space for 6 engineers and the top-notch equipment for orbital construction.
	}
}
