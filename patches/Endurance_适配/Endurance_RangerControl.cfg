// ============================================================================
//  漫游者号（Ranger / ENrangerBody）：无人控制 + 深空级内置天线
//  作者：Codex  2026-10-13
//
//  需求：① 无人也能飞（去掉"必须有飞行员"的限制）
//        ② 内置天线在跟踪站三级（DSN L3）时最远 44 Gm 以上
//
//  ── 改前（Endurance/Parts/Ranger/ranger.cfg）─────────────────────────
//    ModuleCommand             minimumCrew = 1   requiresPilot = True   remoteControl = True
//    ModuleDataTransmitter     antennaType = INTERNAL  antennaPower = 5000
//                              packetSize = 2  packetInterval = 1.0  packetResourceCost = 12
//      antennaPower 5000 就是原版探针核心那套内置天线（对 DSN L3 只有 0.04 Gm）。
//
//  ── 本次改动 ───────────────────────────────────────────────────────
//    ① ModuleCommand：minimumCrew 1 → 0，requiresPilot True → False（remoteControl 保持 True）
//       无人时靠已有的 ModuleSAS（SASServiceLevel = 3）+ 反作用轮姿控，不需要飞行员。
//    ② 内置天线：antennaPower 5000 → 10000000000
//       CommNet 链路公式：最远距离 = sqrt(本舰 antennaPower × 对方功率)
//       DSN 三级功率 2.5e11 m（CustomBarnKit\default.cfg: DSNRange = 2e9, 5e10, 2.5e11）
//       → sqrt(1e10 × 2.5e11) = 5.0e10 m = 50.0 Gm（高于需求的 44 Gm）
//
//  ── 为什么取 1e10（对标现装天线，全部按上面公式换算到 DSN L3）──────
//        Reflectron KR-7            4e9     → 31.6 Gm   （不够）
//        44 Gm 的精确解             7.744e9 → 44.0 Gm   （现装零件里没有这个值）
//        Communotron Ground HG-48   1e10    → 50.0 Gm   ★ 采用：44 Gm 需求之上最接近的现成天线
//        RA-15 / HG-55 / HG-61      1.5e10  → 61.2 Gm   （想连 Dres 最远距离一起覆盖就换这个）
//        Communotron 88-88 / RA-100 1e11    → 158.1 Gm
//        —— 四级深空网（OPM 把 DSNRange 追加到 2e12）时：1e10 → 141.4 Gm
//
//  ── 两个附带结论 ───────────────────────────────────────────────────
//    · 天线类型保持 INTERNAL。CommNetAntennasConsumptor 的规则只给 RELAY/DIRECT 天线加常驻电耗
//      （"No INTERNAL Antennas Consumption"），所以这次加强不会动到冬眠那套电力预算；
//      发射数据时仍按 packetResourceCost = 12 计费。
//    · 数据速率保持原样（packetSize 2 / packetInterval 1.0 = 2 Mits/s），从 Dres 传科研会偏慢。
//
//  只作用于 ENrangerBody（漫游者号）；蝰蛇未改动。删掉本文件即完全还原。
// ============================================================================

@PART[ENrangerBody]:NEEDS[Endurance]:FINAL
{
	// ---- ① 无人控制核心 ----
	@MODULE[ModuleCommand]
	{
		%minimumCrew = 0
		%requiresPilot = False
		%remoteControl = True
	}

	// ---- ② 内置天线：DSN 三级 50 Gm（需求 44 Gm 以上）----
	@MODULE[ModuleDataTransmitter]
	{
		%antennaPower = 10000000000
	}
}
