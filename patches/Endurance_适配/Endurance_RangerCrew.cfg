// ============================================================================
//  漫游者号（Ranger / ENrangerBody）座位数 4 → 6：解决 DeepFreeze 无法解冻
//  作者：Codex  2026-10-13
//
//  ── 症状 ───────────────────────────────────────────────────────────
//    解冻时提示「代码执行错误:无法唤醒乘员」/「唤醒程序终止」
//
//  ── 证据链（都来自本机文件）────────────────────────────────────────
//    ① KSP.log：
//         [LOG 21:21:55.686] Could not start kerbal Thaw process as seat is taken by
//         another kerbal. Very Very Bad. Report this to Mod thread
//       （同一秒的第二次尝试也一样）
//    ② saves\KISA\persistent.sfs 里漫游者号的冷冻舱：
//         FreezerSize = 4
//         TotalFrozen = 3
//       同一艘船上醒着的乘员只有一个：crew = Bob Kerman
//    ③ 于是 4 个座位 = Bob（1）+ 冻结中的三人占位（3）→ 一个空位都没有
//
//  ── 为什么这是"设计使然"而不是 bug ─────────────────────────────────
//    DeepFreeze 的规则是：**解冻必须有一个空座位**给醒过来的乘员。
//    机身原始 CrewCapacity = 4、冬眠位 4 个，两者相等 —— 只要三人睡着、
//    一人在外面坐着，就永远腾不出座位，谁也别想醒。
//    （Endurance_Cryo.cfg 里那句"4 个冬眠位正好用满 CrewCapacity = 4"
//      是当时的想法，现在证明是个坑，注释我已同步更正。）
//
//  ── 改动历史 ───────────────────────────────────────────────────────
//    2026-10-13  CrewCapacity 4 → 6 → 10（为了修 DeepFreeze 解冻"座位被占"）
//    2026-10-14  按你的要求把座位定回 4（飞船编制 4 人）
//      ⚠️ 2026-10-14 源码更正（DeepFreezerPart.cs v1.33，与本地 DLL 日志字符串对得上）：
//         解冻有两道闸门，都不看冬眠位数：
//           ① part.protoModuleCrew.Count >= part.CrewCapacity -> "Part is full"
//              （只数醒着的乘员，冻着的不算）
//           ② 要把人放回"冻住时记下的 IVA 座位号"（part.internalModel.seats[SeatIdx]），
//              那个座位被**别人**坐着就直接中止 —— 屏幕上「代码执行错误:无法唤醒乘员」，
//              日志 "Could not start kerbal Thaw process as seat is taken by another kerbal"
//         所以 ② 才是我们踩的坑：全冻时解冻必定成功（没人占座）；有 1 人值班时，
//         让他先出舱/转移到别的舱段再解冻即可，解冻完再回来。
//      · 座位不会自动塞人；USI-LS 消耗按"实际在船乘员"算，容量本身不花钱
//
//  ── 为什么不用动 craft / 存档 ──────────────────────────────────────
//    CrewCapacity 是零件配置字段：我核对过，craft 里没有它，存档里出现的
//    6 处 "CrewCapacity" 全部是科技树升级的 "HasCrewCapacity"，不是零件字段。
//    所以改配置后重启游戏，已发射的漫游者号也会跟着变成 4 个座位。
//
//  只作用于 ENrangerBody。想还原：删掉本文件（座位会回到 4，解冻会再次卡住）。
// ============================================================================

@PART[ENrangerBody]:NEEDS[Endurance]:FINAL
{
	%CrewCapacity = 4
}
