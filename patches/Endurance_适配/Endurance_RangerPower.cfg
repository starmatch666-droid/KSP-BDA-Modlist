// ============================================================================
//  漫游者号（Ranger / ENrangerBody）电力调整 —— 作者：Codex  2026-10-13
//
//  需求：① 增强托卡马克产电量（在"增强产电"与"降低引擎/RCS 耗电"之间选了前者）
//        ② 内置电量提高到 5000
//        ③ 增加一个"低功耗待机档"，供冬眠舱 / 动量轮这类常驻小负载跑长航程
//
//  ── 改之前的实际数值（全部来自现装文件，非估算）──────────────────────
//    Endurance/Parts/Ranger/ranger.cfg
//        RESOURCE ElectricCharge   amount = maxAmount = 1000
//        ModuleEnginesFX（VTOL）    IntakeAtm 1 + ElectricCharge 98.039
//        ModuleRCSFX                LqdHydrogen 1 + ElectricCharge 5.211
//                                   （这两个 EC 比例是 CRP 补丁改过的现值）
//        ModuleReactionWheel        ElectricCharge rate = 5
//    Endurance/Patches/Power2.cfg   @PART[ENrangerBody]
//        ModuleResourceConverter "Tokamak Reactor"
//            INPUT  FusionPellets 0.001 /s
//            OUTPUT ElectricCharge 1000 /s
//
//  ── 本次改动（只动产电侧；推力、比冲、燃料比例、RCS 参数一律不碰）──────
//    ① 托卡马克产电：ElectricCharge 1000 → 1500 /s（2026-10-13 定稿：保留"要盯电"的手感）
//       输入 FusionPellets 保持 0.001 /s 不变
//       → 即"每颗聚变燃料丸换到的电"变成 150 万 EC/颗（原版 100 万），续航时间不变（50 颗仍是约 13.9 小时）
//       → 若想让燃料也按 1.5 倍烧，把下面 INPUT_RESOURCE 的 @Ratio 改成 0.0015 即可
//    ② 内置电池：1000 → 5000（amount 与 maxAmount 一起改）
//       2026-10-13：主档改为「默认启动」（IsActivated = True）—— 起飞的飞机上托卡马克就是运行状态，
//       电池满了它会自己停（不白烧燃料），存量 craft 需要重放零件或改文件，见文件末尾说明。
//    ③ 待机档（新增模块）：输出 10 EC/s，耗 FusionPellets 0.000002 /s
//       —— 效率说明（2026-10-13 定稿）：主档 1500 EC/s ↔ 0.001 颗/s = 150 万 EC/颗；
//          待机档 10 EC/s ↔ 0.000002 颗/s = 500 万 EC/颗 → 待机档比主档省 3.3 倍，
//          长航段用待机档更划算（下面那组天数就是按待机档算的）
//       —— 负载参照：DeepFreeze 维持费 = FrznChargeRequired 10 EC/分钟/人 = 0.167 EC/s/人
//          （源码 Source/DeepFreezerPart.cs: "ECreqd = FrznChargeRequired / 60.0f * timeperiod * TotalFrozen"）
//          4 名乘员全冻 ≈ 0.67 EC/s，加动量轮满载 5 EC/s（Ranger 的 RESOURCE rate = 5）≈ 5.7 EC/s
//          → 10 EC/s 约有 1.8 倍余量；跑引擎/RCS（数百 EC/s 级）必须切回主档
//       —— 50 颗燃料丸连续待机约 1157 天；Dres 那趟 426 天连续只需 18.4 颗，
//          若按实际负载折算（电池满就停）约 10.5 颗
//       —— 待机档 GeneratesHeat = False，不需要散热器；输出不排空，电池满了自动停
//
//  ── 为什么用"含 FusionPellets 输入"来认托卡马克，而不是认 ConverterName ──
//    ① ModuleManager 解析不了带空格的子节点名（本机 KSP.log 里就有实证：
//       "Error - Skipping a patch subnode with unbalanced square brackets or a
//        space (replace them with a '?')"），所以写 [Tokamak Reactor] 会被整段跳过。
//    ② 就算改用 [Tokamak?Reactor]，Endurance_CN 的中文补丁在同一趟 FINAL 里
//       会先把 ConverterName 改成"托卡马克反应堆"；一旦它比本文件先跑，
//       按名字匹配就会落空、而且不报错（最难受的那种静默失效）。
//    ③ 因此这里按结构认：漫游者号上只有托卡马克这一个 ModuleResourceConverter
//       吃 FusionPellets（燃料电池吃的是 LqdHydrogen + Oxidizer），
//       无论中英文名、无论补丁先后，都能稳定命中。
//
//  ── 作用范围 ──────────────────────────────────────────────────────
//    只作用于 ENrangerBody（漫游者号）。蝰蛇（ENminiRanger）未改动 ——
//    它的托卡马克只有 200 EC/s、电池 500，要一起加就照抄本文件换个零件名。
//    本机未安装 WildBlueIndustries/DSEV，Power2.cfg 走的是 ModuleResourceConverter
//    分支；若日后装了 DSEV（模块名会变成 ModuleFusionReactor），本补丁需照抄一份换模块名。
//    漫游者号上只有一个 ElectricCharge 存电量节点，@RESOURCE 不会误伤反应轮那类嵌套 RESOURCE。
//    本文件新增的模块会落在零件模块表的末尾（或同类模块之后），位置都在终版模块表第 6 位
//    （ModuleScienceContainer）之后，所以不会动到 Endurance_RangerScience.cfg 里的
//    containerModuleIndex = 6 / 8。
//
//  删掉本文件即完全还原。
// ============================================================================

@PART[ENrangerBody]:NEEDS[Endurance]:FINAL
{
	// ---- ① 托卡马克产电：1000 → 1500 EC/s ----
	//  产电上限只管"瞬时能带多少负载"，燃料消耗固定 0.001 颗/s，加大输出不额外烧料。
	//
	//  2026-10-13 重写（重要）：原来只写了"认吃 FusionPellets 的转换器"这一条嵌套 HAS 过滤，
	//  但用户实测反推出产电仍是 1000 EC/s（两台引擎 90% 油门吃 810 EC/s 时"补电刚好持平"，
	//  若真按 3000/5000 产电，净流量应该还富余两千多）—— 说明那条子选择器一直静默没命中。
	//  现在改成三条互相独立的匹配方式，命中任意一条即可；重复设同一个值是无害的：
	//  输出值定稿 1500 EC/s（用户指定）：两台标定后的引擎全开 675 EC/s，再叠 RCS 与生活负载
	//  约 1000~1300 EC/s —— 正好是"得盯着电、但全开也顶得住"的手感。

	//  (1) 按中文模块名匹配（中文补丁实际生效后就是这个值，截图里也是"托卡马克反应堆"）
	@MODULE[ModuleResourceConverter]:HAS[#ConverterName[托卡马克反应堆]]
	{
		@OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]]
		{
			@Ratio = 1500
		}
		%IsActivated = True

		// 防"温度降效"（保险，非当前故障原因）：原始 ThermalEfficiency 曲线是 200 K 以下
		// 效率 0、1600 K 以上也是 0 —— 也就是说零件一旦被冻冷/烤热，转换器会静默降到零输出，
		// 而 SPH 里是室温看不出来。先把这个可能性堵死（换恒 1），发热与专家加成一并中性化。
		!ThermalEfficiency {}
		ThermalEfficiency
		{
			key = 0 1 0 0
			key = 1 1 0 0
		}
		%GeneratesHeat = False
		%EfficiencyBonus = 1
		%UseSpecialistBonus = False

		// 丸子按"全船可用"抽取，避免因阶段优先取不到燃料而停机
		@INPUT_RESOURCE:HAS[#ResourceName[FusionPellets]]
		{
			%FlowMode = ALL_VESSEL
		}
	}

	//  (2) 按英文模块名匹配（空格用 ? 代替，这是 ModuleManager 自己的建议写法）
	@MODULE[ModuleResourceConverter]:HAS[#ConverterName[Tokamak?Reactor]]
	{
		@OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]]
		{
			@Ratio = 1500
		}
		%IsActivated = True

		!ThermalEfficiency {}
		ThermalEfficiency
		{
			key = 0 1 0 0
			key = 1 1 0 0
		}
		%GeneratesHeat = False
		%EfficiencyBonus = 1
		%UseSpecialistBonus = False
		@INPUT_RESOURCE:HAS[#ResourceName[FusionPellets]]
		{
			%FlowMode = ALL_VESSEL
		}
	}

	//  (3) 按输入资源匹配（原先的写法，留作兜底）
	@MODULE[ModuleResourceConverter]:HAS[@INPUT_RESOURCE:HAS[#ResourceName[FusionPellets]]]
	{
		@OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]]
		{
			@Ratio = 1500
		}
		%IsActivated = True

		!ThermalEfficiency {}
		ThermalEfficiency
		{
			key = 0 1 0 0
			key = 1 1 0 0
		}
		%GeneratesHeat = False
		%EfficiencyBonus = 1
		%UseSpecialistBonus = False
		@INPUT_RESOURCE:HAS[#ResourceName[FusionPellets]]
		{
			%FlowMode = ALL_VESSEL
		}
	}

	//  默认启动：新放置的漫游者号一上发射台，主档就是运行状态。
	//  只影响"新造的"零件；已存盘的 craft（漫游者号.craft / 自动存档飞船.craft）已直接把
	//  那一行改成 True；已升空的旧飞船仍是 False，需要手动开一次或重放零件。
	//  电池装满时转换器会自己停，所以常开 ≠ 常烧燃料。
	//  燃料消耗保持 0.001 /s 不变。要让燃料也按 1.5 倍烧，把 INPUT_RESOURCE 的 Ratio 改成 0.0015。

	// ---- ② 内置电池：1000 → 5000 ----
	@RESOURCE[ElectricCharge]
	{
		@amount = 5000
		@maxAmount = 5000
	}

	// ---- ④ 内置太阳能板：固定 20 EC/s，不看姿态（2026-10-13 按实测要求改回）----
	//  第一版用 ModuleDeployableSolarPanel + alignType 做方向敏感，实测"四个方向都不发电"
	//  （模型里拿不到合适的参考 transform，或者说太阳入射角算不出来），所以按需求放弃姿态：
	//  用 ModuleGenerator —— 原版 RTG / 太阳能板内部用的就是它：
	//    · isAlwaysActive = True  → 不需要开关
	//    · 没有输入资源           → 等价于"永远正对太阳"，随时随地 20 EC/s
	//    （方向敏感那版留在文件末尾注释里，将来想再试可以直接改回去）
	MODULE
	{
		name = ModuleGenerator
		isAlwaysActive = True
		OUTPUT_RESOURCE
		{
			name = ElectricCharge
			rate = 20
		}
	}

	// ── 存档备注：方向敏感版（实测四向无输出，暂不启用）
	//MODULE
	//{
	//	name = ModuleDeployableSolarPanel
	//	panelType = FLAT
	//	alignType = Y
	//	raycastTransformName = ranger_body
	//	resourceName = ElectricCharge
	//	chargeRate = 20
	//	isTracking = False
	//	trackingMode = NONE
	//	retractable = False
	//	useAnimation = False
	//	isBreakable = False
	//	showStatus = True
	//	powerCurve { key = 0 1 0 0  key = 1 1 0 0 }
	//}

	// ---- ③ 低功耗待机档：10 EC/s ----
	//  给"冬眠舱 + 动量轮"这种常驻小负载用（长航程的默认模式）。
	//  与主档并列的两个模式，面板上各自有 启动/停止/切换 按钮，可随时切换；
	//  两档可以同时开，但跑引擎/RCS 时只有主档供得上电。
	//  显示名直接写中文（游戏是中文环境；本文件不参与 Endurance_CN 的改名，改语言时改这里即可）。
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = 托卡马克待机档
		StartActionName = 启动待机档
		StopActionName = 停止待机档
		ToggleActionName = 切换待机档
		AutoShutdown = False
		GeneratesHeat = False
		UseSpecialistBonus = false
		INPUT_RESOURCE
		{
			ResourceName = FusionPellets
			Ratio = 0.000002
			FlowMode = STAGE_PRIORITY_FLOW
		}
		OUTPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 10
		}
	}
}
