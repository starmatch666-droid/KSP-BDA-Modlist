// ============================================================================
//  漫游者号整机抗热（为进出 Eve 用）        作者：Codex  2026-10-14
// ----------------------------------------------------------------------------
//  背景：Eve 大气又厚又热，漫游者号过不去。查证过的原始耐热值（含出处）：
//      ENrangerBody        maxTemp 1500  skinMaxTemp 2900  ← 机身本体最脆
//      docking-linear-1    maxTemp 1400                    ← 对接口
//      CA_drogue（减速伞） maxTemp 1800
//      SXTAntenna          maxTemp 2000
//      stripLight1         maxTemp 2000
//      airbrake1           maxTemp 2400
//      ENrangerEngine      maxTemp 2900
//    关键：除机身本体外，这些零件都**没写 skinMaxTemp** —— KSP 缺省时拿 maxTemp
//    当蒙皮上限，所以再入时它们都是"蒙皮一过 2000 出头就烧掉"。
//
//  本补丁（只针对漫游者号机上这 7 种零件）：
//      maxTemp          → 4000   （材料/内部上限；原版防热盾是 3300）
//      skinMaxTemp      → 3600   （蒙皮上限；原版防热盾是 3300）
//      emissiveConstant → 0.9    （辐射散热拉满，热起来散得更快）
//    推力、质量、气动一律不动 —— 只动耐热与散热。
//
//  想更狠：两个数字改成 5000 / 4800；或加一行 %heatConductivity = 0.3
//          （把热更快导进零件内部——内部上限更高、热容更大）。
//  想还原：删掉本文件。
//  注意这是"同型号零件"级改动：美神号上的 docking-linear-1、以及别处的
//  stripLight1 / airbrake1 等也会一并受益（这几种零件本来就不是专供漫游者号）。
// ============================================================================

@PART[ENrangerBody|ENrangerEngine|airbrake1|docking-linear-1|SXTAntenna|stripLight1|CA_drogue|CA.drogue]:FINAL
{
	%maxTemp = 4000
	%skinMaxTemp = 3600
	%emissiveConstant = 0.9
}
