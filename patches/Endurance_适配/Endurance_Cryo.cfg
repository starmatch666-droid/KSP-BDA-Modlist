// ============================================================================
//  Endurance 徘徊者：加入 DeepFreeze 冬眠舱（3 个冬眠位，甘油 50）  2026-10-12
//  2026-10-14：冬眠位 4 -> 3（按你的要求：4 座编制 + 3 个冬眠位）
//  2026-10-13 修订：登陆舱 ENlanderBody 已从游戏移除，删掉对应那段；本文件
//  现在只作用于保留的徘徊者 Ranger。
// ----------------------------------------------------------------------------
//  依据 · DeepFreeze 自带零件的写法（REPOSoftTech\DeepFreeze\...\CRY0300Freezer.cfg）：
//        MODULE { name = DeepFreezer  FreezerSize = 1  ChargeRequired = 3000
//                 GlykerolRequired = 5  ChargeRate = 30 }
//        RESOURCE { name = Glykerol ... }
//        —— FreezerSize 就是"冬眠位"数量；ChargeRequired/GlykerolRequired 是每次
//           冷冻/解冻消耗的电力与甘油；ChargeRate 是维持低温的耗电速率。
//
//  ⚠️ 2026-10-13 更正：原以为"4 个冬眠位正好用满 CrewCapacity = 4"，
//     实测证明这是个坑 —— DeepFreeze 的**解冻需要一个空座位**，
//     座位数与冬眠位相等时会出现"三个人睡着 + 一个人值班 = 0 空位"，
//     结果谁都醒不过来（日志原文：Could not start kerbal Thaw process as
//     seat is taken by another kerbal）。现在座位数由
//     Endurance_RangerCrew.cfg 提到 6，留 2 个空位。
//  ⚠️ 2026-10-14 再更正：解冻失败的根因不是"冬眠位数量"，而是 DeepFreeze 要把人
//     放回**冻住时记下的那个座位号**（DLL 原文流程：Part has internals ->
//     "Checking their seat taken=" -> 冲突则 "seat is taken by another kerbal"）。
//     而座位是 FreeIva 按 CrewCapacity 动态生成的，所以"船上人数 == 座位数"时
//     就可能撞号失败。降到 3 个冬眠位不会消除这个冲突 —— 它管的是"最多睡几个"。
//     另外 DeepFreeze 内部用 bool[FreezerSize] 去索引 IVA 座位号
//     （resetFrozenKerbals()，源码 3660-3666 行），隐含假设"IVA 座位数 == FreezerSize"；
//     FreezerSize 比座位数小时（例如 4 座配 3 个冬眠位）这个自愈路径有越界风险，
//     所以 4 座配 4 冬眠位才是与 mod 假设一致的原配。
//  只依赖 DeepFreeze；没装时整段不生效（NEEDS 保护）。撤销：删掉本文件。
// ============================================================================

// ---- 徘徊者（Ranger）：4 个冬眠位，甘油储量 50 ----
@PART[ENrangerBody]:NEEDS[DeepFreeze]:FINAL
{
	RESOURCE
	{
		name = Glykerol
		amount = 50
		maxAmount = 50
	}

	MODULE
	{
		name = DeepFreezer
		FreezerSize = 3
		ChargeRequired = 3000
		GlykerolRequired = 5
		ChargeRate = 30
	}
}

