// ============================================================
// Ranger / Viper 客运舱 → 全能科研中枢
//   2026-10-13   移植自 0000Tinygrox_CNPatches/ZZZ_HardcodedPatches/ZZZ_Mk33Krew_ScienceLab.cfg
//                （即 Mk-33 乘员模块那套，参数保持完全一致）
//   目标部件：ENrangerBody（Ranger，乘员 4）
//             ENminiRanger（Viper Composite Fuselage，乘员 2）
//
// ── 需求映射（与 Mk-33 版相同）───────────────────────────────
//   ① 可收集    → ModuleScienceContainer.dataIsCollectable
//                 + 所有实验的 dataIsCollectable
//   ② 可重做    → ModuleScienceLab.canResetConnectedModules / canResetNearbyModules
//                 （一键重置全船实验，不需要 EVA 找科学家）
//   ③ 可回收    → ModuleScienceContainer.dataIsRecoverable
//                 （带数据返回 Kerbin 可拿满价值）
//   ④ 可重复运行 → 所有实验 rerunnable = True
//                 + 容器 allowRepeatedSubjects = True（能同时存同一科目的多份）
//   ⑤ 外挂实验套件 + 数据加工（ModuleScienceConverter）
//
// ── ⚠️ 关键技术点：containerModuleIndex ─────────────────────
//   ModuleScienceLab 靠 containerModuleIndex 在同部件上找 ModuleScienceContainer，
//   索引必须指向【该零件最终模块列表里那个容器的位置】。MM 的 MODULE 只会【追加到
//   末尾】，所以本补丁新增的模块不会移动容器的下标；只要没有补丁在容器之前
//   【插入】或【删除】模块，下标就等于它在原 cfg 里的位置。
//
//   实测两个零件的原 cfg 模块顺序（均无 MODULE:NEEDS 条件模块）：
//
//     ENrangerBody                       ENminiRanger
//       [0] ModuleDataTransmitter          [0] ModuleDataTransmitter
//       [1] ModuleEnginesFX                [1] ModuleEnginesFX
//       [2] ModuleCommand                  [2] FXModuleAnimateThrottle
//       [3] ModuleLiftingSurface           [3] ModuleCommand
//       [4] ModuleReactionWheel            [4] ModuleLiftingSurface
//       [5] ModuleScienceExperiment        [5] ModuleReactionWheel
//       [6] ModuleScienceContainer ★       [6] ModuleRCSFX
//       [7] ModuleSAS                      [7] ModuleScienceExperiment
//       ...                                [8] ModuleScienceContainer ★
//                                          [9] ModuleSAS
//
//   → ENrangerBody   containerModuleIndex = 6
//     ENminiRanger   containerModuleIndex = 8
//
//   ⚠️ 如果以后有补丁在容器之前插/删模块，这两个数字要跟着改。
//      下标写错的症状：日志里 ModuleScienceLab 报找不到容器 /
//      右键没有「开始研究」按钮。
//
// ── ⚠️ 平衡说明 ─────────────────────────────────────────────
//   原版神秘黏性物质 / 材料实验是【不可重置】的（需要科学家 EVA 或实验室重置）。
//   这里和 Mk-33 一样设成 rerunnable = True，即【可无限重复做】，
//   会让刷科研点变容易。想恢复原版难度：把这两个实验的 rerunnable 改回 False。
//
// 不改 Endurance 原文件，删掉本文件即完全还原。
// ============================================================


// ============================================================
// ① 增强已有的容器与 crewReport（两个零件通用）
// ============================================================
@PART[ENrangerBody|ENminiRanger]:NEEDS[Endurance]:FINAL
{
	@MODULE[ModuleScienceContainer]
	{
		// ---- ③ 可回收 ----
		%dataIsRecoverable = True

		// ---- ① 可收集 ----
		%dataIsCollectable = True
		%dataIsStorable = True
		%CollectOnlyOwnData = False

		// ---- ④ 可重复（同一科目可存多份）----
		%allowRepeatedSubjects = True

		// ---- 容量 ----
		// 与 Mk-33 版保持一致：不设 capacity。全库科学容器都用同一个代码默认值
		// （不限量），单独设上限反而是降级。
		//%capacity = 1000

		// ---- 便利性：飞船里也能存，不必 EVA ----
		%evaOnlyStorage = False
		%storageRange = 30
	}

	// crewReport 对齐原版舰桥 / Mk-33 乘员模块的写法
	@MODULE[ModuleScienceExperiment]:HAS[#experimentID[crewReport]]
	{
		%experimentActionName = #autoLOC_502009
		%resetActionName = #autoLOC_502010
		%reviewActionName = #autoLOC_502200
		%rerunnable = True
		%dataIsCollectable = True
		%collectActionName = 取走数据
		%interactionRange = 1.5
		%usageReqMaskInternal = 5
		%usageReqMaskExternal = -1
	}
}


// ============================================================
// ② 实验室（可重做）—— 参数照抄 Mk-33 版
//    dataStorage 按 Mk-33 的 1500（原版实验室是 750）
// ============================================================
@PART[ENrangerBody]:NEEDS[Endurance]:FINAL
{
	MODULE
	{
		name = ModuleScienceLab
		containerModuleIndex = 6		// ★ Ranger：容器在原 cfg 的第 7 个模块
		dataStorage = 1500
		crewsRequired = 1
		canResetConnectedModules = True
		canResetNearbyModules = True
		interactionRange = 5
		SurfaceBonus = 0.1
		ContextBonus = 0.25
		homeworldMultiplier = 0.1
		RESOURCE_PROCESS
		{
			name = ElectricCharge
			amount = 10
		}
	}
}

@PART[ENminiRanger]:NEEDS[Endurance]:FINAL
{
	MODULE
	{
		name = ModuleScienceLab
		containerModuleIndex = 8		// ★ Viper：容器在原 cfg 的第 9 个模块
		dataStorage = 1500
		crewsRequired = 1
		canResetConnectedModules = True
		canResetNearbyModules = True
		interactionRange = 5
		SurfaceBonus = 0.1
		ContextBonus = 0.25
		homeworldMultiplier = 0.1
		RESOURCE_PROCESS
		{
			name = ElectricCharge
			amount = 10
		}
	}
}


// ============================================================
// ③ 数据加工 + 内建实验套件（两个零件通用）
//    所有实验 rerunnable / dataIsCollectable 与 Mk-33 版一致
// ============================================================
@PART[ENrangerBody|ENminiRanger]:NEEDS[Endurance]:FINAL
{
	// ---- 数据加工：把数据变成科研点 ----
	MODULE
	{
		name = ModuleScienceConverter
		dataProcessingMultiplier = 0.5
		scientistBonus = 0.25
		researchTime = 7
		scienceMultiplier = 5
		scienceCap = 500
		powerRequirement = 5
		ConverterName = 研究
		StartActionName = 开始研究
		StopActionName = 停止研究
