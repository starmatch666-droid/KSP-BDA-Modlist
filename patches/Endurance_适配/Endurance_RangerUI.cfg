// ============================================================================
//  漫游者号（Ranger / ENrangerBody）右键菜单分组 —— 作者：Codex  2026-10-13
//
//  目标：把零件 PAW（右键菜单）那一长串按钮收进可折叠的分类里
//
//  ── 机制 ──────────────────────────────────────────────────────────────
//    B9PartSwitch 2.21 自带配置级分组器 ModuleB9AssignUiGroups：按
//    IDENTIFIER 唯一识别一个模块，把它的 PAW 条目塞进 uiGroupName 指定的分组。
//    官方说明见 B9PartSwitch/CHANGELOG.md 第 99-116 行。
//
//  ── 三个坑，都是实测（KSP.log）踩出来的 ──────────────────────────────
//    ① 选择器里不能有空格：老写法 :HAS[#ConverterName[Tokamak Reactor]] 会被
//       ModuleManager 整段跳过（日志里有 "Skipping a patch subnode ... a space"）。
//    ② IDENTIFIER 必须逐实例唯一（"it can have any other fields that uniquely
//       identify the module"），只写模块名一把抓不行。
//    ③ 【本文件第二版踩的坑】IDENTIFIER 必须写成**多行节点**。写成一行内联
//       （IDENTIFIER { name = X  Y = Z }）时 B9PartSwitch 解析不出 name，
//       FindModule 会抛 "Exception: Could not find matching module"，
//       而且是一条一个异常 —— 结果就是所有分组全部失效、面板上一个组都不出现。
//       另外，identifier 指向的模块如果**根本不存在**（比如被别的补丁删掉的、
//       或者装在不在这零件上的模块），同样会抛这个异常，所以这里只保留确实存在的。
//
//  ── 本文件做的事 ─────────────────────────────────────────────────────
//    ① 删掉 DockRotate 的调试模块（纯调试，顺带少两个按钮）
//    ② 6 个科研实验改成"不可用时隐藏"，平时只显示当前环境能做的
//    ③ 用 ModuleB9AssignUiGroups 建这些可折叠分组：
//       电力   = 燃料电池 / 托卡马克主档 / 待机档 / 内置太阳能发电机
//       冬眠舱 = DeepFreezer（含 4 个冷冻-唤醒按钮）
//       实验   = 7 个实验 + 容器 + 实验室 + 数据加工
//       发动机 / RCS / 进气 / 起落架 / 悬浮控制
//       对接口 = 对接口 + DockRotate + 重命名对接口 + 焊接对接口
//       指令舱 / 库存 / 通信 / 自动驾驶 / 导航
//
//  注意：Endurance 自带的 Endurance/Patches/B9UIGroups.cfg 里那三条 identifier
//  是按英文 ConverterName 写的，被中文补丁改名后匹配不到，会继续在日志里抛
//  "Could not find matching module"（无害，但没法只删它们那三条，忽略即可）。
//
//  只作用于 ENrangerBody（漫游者号）。删掉本文件即完全还原。
// ============================================================================

@PART[ENrangerBody]:NEEDS[B9PartSwitch]:FINAL
{
	// ---- 直接减按钮 ----
	!MODULE[DockRotateDebug] {}

	@MODULE[ModuleScienceExperiment]
	{
		%hideUIwhenUnavailable = True
	}

	// ---- 分组 ----
	%MODULE[ModuleB9AssignUiGroups]
	{
		// ===== 电力：三个转换器逐实例 + 内置太阳能发电机 =====
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleResourceConverter
				ConverterName = 燃料电池
			}
			uiGroupName = Power
			uiGroupDisplayName = 电力
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleResourceConverter
				ConverterName = 托卡马克反应堆
			}
			uiGroupName = Power
			uiGroupDisplayName = 电力
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleResourceConverter
				ConverterName = 托卡马克待机档
			}
			uiGroupName = Power
			uiGroupDisplayName = 电力
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleGenerator
			}
			uiGroupName = Power
			uiGroupDisplayName = 电力
		}

		// ===== 冬眠舱 =====
		MODULE
		{
			IDENTIFIER
			{
				name = DeepFreezer
			}
			uiGroupName = Cryo
			uiGroupDisplayName = 冬眠舱
		}

		// ===== 实验：7 个实验按 experimentID 逐个 + 容器 / 实验室 / 数据加工 =====
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceExperiment
				experimentID = crewReport
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceExperiment
				experimentID = temperatureScan
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceExperiment
				experimentID = barometerScan
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceExperiment
				experimentID = gravityScan
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceExperiment
				experimentID = mysteryGoo
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceExperiment
				experimentID = mobileMaterialsLab
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceExperiment
				experimentID = surfaceSample
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceContainer
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceLab
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleScienceConverter
			}
			uiGroupName = Science
			uiGroupDisplayName = 实验
		}

		// ===== 动力 =====
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleEnginesFX
			}
			uiGroupName = Engine
			uiGroupDisplayName = 发动机
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleRCSFX
			}
			uiGroupName = RCS
			uiGroupDisplayName = RCS
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleResourceIntake
				resourceName = IntakeAir
			}
			uiGroupName = Intake
			uiGroupDisplayName = 进气
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleResourceIntake
				resourceName = IntakeAtm
			}
			uiGroupName = Intake
			uiGroupDisplayName = 进气
		}

		// ===== 起落架 / 悬浮 =====
		MODULE
		{
			IDENTIFIER
			{
				name = ENLandingLeg
			}
			uiGroupName = Gear
			uiGroupDisplayName = 起落架
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ENAnimateControlled
			}
			uiGroupName = Gear
			uiGroupDisplayName = 起落架
		}
		MODULE
		{
			IDENTIFIER
			{
				name = WBIHoverController
			}
			uiGroupName = Hover
			uiGroupDisplayName = 悬浮控制
		}

		// ===== 对接口（含 DockRotate 的 Port Force/Torque/Range 与重命名）=====
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleDockingNode
			}
			uiGroupName = Dock
			uiGroupDisplayName = 对接口
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleDockRotate
			}
			uiGroupName = Dock
			uiGroupDisplayName = 对接口
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleDockingNodeNamed
			}
			uiGroupName = Dock
			uiGroupDisplayName = 对接口
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleWeldablePort
			}
			uiGroupName = Dock
			uiGroupDisplayName = 对接口
		}

		// ===== 指令舱 / 库存 / 通信 / 自动驾驶 / 导航 =====
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleCommand
			}
			uiGroupName = Cmd
			uiGroupDisplayName = 指令舱
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleInventoryPart
			}
			uiGroupName = Storage
			uiGroupDisplayName = 库存
		}
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleAntennaInfo
			}
			uiGroupName = Comm
			uiGroupDisplayName = 通信
		}
		MODULE
		{
			IDENTIFIER
			{
				name = MechJebCore
			}
			uiGroupName = Autopilot
			uiGroupDisplayName = 自动驾驶
		}
		MODULE
		{
			IDENTIFIER
			{
				name = TrajectoriesVesselSettings
			}
			uiGroupName = Nav
			uiGroupDisplayName = 导航
		}
	}
}
