// ============================================================================
//  漫游者号两台引擎：推力 100% + 耗氢降到 75% 档 + 电耗也留在 75% 档
//  作者：Codex  2026-10-13（第三版）
//
//  ── 需求演变 ───────────────────────────────────────────────────────
//    v1：推力整体 ×0.75，让"满推力"落在电力撑得住的工作点
//    v2：发现机身 VTOL 推力不足、没法正常垂直降落 → 推力恢复 100%，
//        电耗靠"电量比例 ×0.75"留在原处
//    v3（本版）：再把**单位推力的耗氢效率提高 1.33 倍** —— 即推力不变的情况下
//        耗氢也降到 75% 档
//
//  ── 关键：耗氢效率只能靠提高比冲 ───────────────────────────────────
//    流量 = 推力 ÷ 比冲。液态氢**有质量**，它参与 Σ(比例×密度) 这个分母，
//    所以改它的比例会被分母抵消，只会顺带把电耗抬高 —— 想省氢只有一条路：
//    把比冲（Isp）乘 1.3333。这同时也是"单位推力的燃料效率"的定义。
//
//    而电耗（ElectricCharge 密度为 0）等于 比例 × 流量：比冲提高后流量降了 25%，
//    所以只要把电量比例**还原**成原值 26.06，满推力的电耗就自动停在原来"75% 油门"
//    的水平 —— 一举两得，不用再单独压电量比例。
//
//  ── 具体数值 ───────────────────────────────────────────────────────
//    XP-F40（ENrangerEngine）：
//        推力(真空/海平面)  180 / 144 kN        ← 100%，与 v2 相同
//        比冲(真空/海平面)  15000 / 12000 → 20000 / 16000   ← ×1.3333 ★本版改动
//        耗氢               17.271 → 12.953 /s  ← 降到 75% 档 ★本版改动
//        电量比例           19.545 → 26.06（还原，交给 CRP 的 26.06）
//        满推力电耗         337.565 /s          ← 不变，仍是 75% 档
//    机身 VTOL（ENrangerBody, engineID = VTOL）：
//        推力(真空)  200 kN、发热 100            ← 100%（垂直降落推力）
//        电量比例    98.039 → 73.529             ← 电耗约 75/s（v2 已定，本版不动）
//        比冲不动（VTOL 烧的是 IntakeAtm，不从船上带燃料，没有省的必要）
//
//  ── 注意 ───────────────────────────────────────────────────────────
//    · 本文件是 :FINAL，在 Endurance/Patches/CRP/Engines.cfg 之后运行；
//      电量比例这里不再覆盖，所以走 CRP 的 26.06。
//    · 比冲曲线用"删掉原曲线再加新的"方式整体替换（key 数量与形状保持原样）。
//    · 想还原：删掉本文件。只恢复原比冲：把三个 key 改回 15000 / 12000 / 0.01。
// ============================================================================

// ---- XP-F40：比冲 ×1.3333（推力不变、耗氢降到 75% 档，电耗顺带停在 75% 档）----
@PART[ENrangerEngine]:NEEDS[Endurance]:FINAL
{
	@MODULE[ModuleEnginesFX]
	{
		// 2026-10-13 第二版修法：原来"删掉整条曲线再新建"的写法实测没生效
		//（MechJeb 仍按 15000/12000 计算，比值 0.752 = 15000/20000），
		// 改成 ModuleManager 标准的"按索引改 curve key"写法：
		//   @key,0 = 0 20000   → 真空 15000 → 20000
		//   @key,1 = 1 16000   → 1 大气压 12000 → 16000
		//   @key,2 = 11 0.0133 -500 0 → 第 3 个 key 同比放大（形状不变）
		@atmosphereCurve
		{
			@key,0 = 0 20000
			@key,1 = 1 16000
			@key,2 = 11 0.0133 -500 0
		}
	}
}

// ---- 机身 VTOL：推力 100%、电耗 75% 档（v2 已定，这里保持）----
@PART[ENrangerBody]:NEEDS[Endurance]:FINAL
{
	@MODULE[ModuleEnginesFX]:HAS[#engineID[VTOL]]
	{
		@maxThrust = 200
		@heatProduction = 100
		@PROPELLANT[ElectricCharge]
		{
			@ratio = 73.529
		}
	}
}
