// ============================================================================
//  聚变反应堆：发热量归零
//     受影响的零件：漫游者号（Ranger）、蝰蛇（Viper）—— 两者共用同一套托卡马克
//     （原本还有 DSPS x300 燃料组件与登陆舱，已随船体一起移除）
//     —— 只关掉发热与过热逻辑。发电量见 Endurance_RangerPower.cfg
//        （漫游者号 1000 → 1500 EC/s，蝰蛇维持原值 200 EC/s），燃料消耗原样保留。
//
//  2026-10-13 修复（此前一直是死代码）：
//     旧选择器 :HAS[#ConverterName[Tokamak Reactor]] 里的空格让 ModuleManager
//     整段跳过该子节点，KSP.log 里有 2 条实证错误：
//       "Error - Skipping a patch subnode with unbalanced square brackets or a
//        space (replace them with a '?') in @PART[ENrangerBody|ENminiRanger]:FINAL"
//     现改为按结构匹配：这两个零件上只有托卡马克这一个 ModuleResourceConverter
//     吃 FusionPellets（燃料电池吃的是 LqdHydrogen + Oxidizer，EPS 变压器吃
//     ElectroPlasma），所以中英文名、补丁先后都不影响命中，也不会误伤燃料电池。
//     修复后反应堆核心不再爬升到 2000 K 自动停机 —— 产电改动（3000 EC/s）才真的可用。
// ============================================================================

@PART[ENrangerBody|ENminiRanger]:FINAL
{
	// 2026-10-13 第三版（关键修复）：原来的选择器是嵌套 HAS 写法，和产电补丁同一款，
	// 已被实测证明会静默失败 —— 所以"关掉发热"其实一直没生效，反应堆在飞行中烧到
	// 2000 K 就自动停机了（SPH 里没有温度模拟，所以面板上看不出来，一升空就只剩 ~130 EC/s 的净流失）。
	// 现在同样改成三路独立匹配：

	//  (1) 中文名（中文补丁生效后的名字）
	@MODULE[ModuleResourceConverter]:HAS[#ConverterName[托卡马克反应堆]]
	{
		@GeneratesHeat = False
	}

	//  (2) 英文名（空格用 ? 代替）
	@MODULE[ModuleResourceConverter]:HAS[#ConverterName[Tokamak?Reactor]]
	{
		@GeneratesHeat = False
	}

	//  (3) 按输入资源匹配（兜底）
	@MODULE[ModuleResourceConverter]:HAS[@INPUT_RESOURCE:HAS[#ResourceName[FusionPellets]]]
	{
		@GeneratesHeat = False
	}

	// 移除核心温度与过热显示（否则没有散热器时会一路升到 2000 K 自动停机）
	!MODULE[ModuleCoreHeat] {}
	!MODULE[ModuleOverheatDisplay] {}
}
