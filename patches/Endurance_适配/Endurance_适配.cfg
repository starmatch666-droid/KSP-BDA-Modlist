//  （见 KISA_Fixes\zz_RemoveEnduranceShip.cfg），所以原来的
//  "维生（USI-LS）" 与 "补给仓扩容" 两大段已经全部作废、一并删除。
//  本文件现在只保留仍然作用于 Ranger（徘徊者）与 Viper（Mini-Ranger）的内容。
//
//  卸载：直接删掉 GameData\Endurance_适配 整个目录即可
