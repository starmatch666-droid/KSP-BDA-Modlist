// ============================================================================
//  漫游者号（Ranger / ENrangerBody）库存扩容 —— 作者：Codex  2026-10-13
//
//  需求：库存容量与槽位提高到至少 20 个
//
//  ── 改前（Endurance/Parts/Ranger/ranger.cfg 第 350-352 行）──────────
//      MODULE { name = ModuleInventoryPart  InventorySlots = 4  packedVolumeLimit = 200 }
//      —— 200 升、4 个槽位（原版 1 号舱是同样的 200 升配置）
//
//  ── 改动历史 ───────────────────────────────────────────────────────
//      2026-10-13  InventorySlots 4 → 24、packedVolumeLimit 200 → 1000 升
//      2026-10-14  packedVolumeLimit 1000 → 10000 升（按你要求：1000 L 完全不够）
//    InventorySlots 24 与原版 2.5m 货舱 CargoStorageUnit 同档；
//    10000 升 ≈ 417 L/槽，比原版 2.5m 货舱（2500 L）还大 4 倍。
//
//  ── 为什么不用动 craft / 存档 ──────────────────────────────────────
//      craft 文件只保存"库存里装了什么"（inventory = ... 与 STOREDPARTS），
//      槽位数与容量来自零件配置，所以改完重启即对新旧载具同时生效。
//
//  只作用于 ENrangerBody。想再大一点：改这两个数字即可（想还原就删掉本文件）。
// ============================================================================

@PART[ENrangerBody]:NEEDS[Endurance]:FINAL
{
	@MODULE[ModuleInventoryPart]
	{
		@InventorySlots = 24
		@packedVolumeLimit = 10000
	}
}
