// ============================================================================
//  漫游者号（Ranger / ENrangerBody）RCS：大幅降低消耗 + 修"没有喷气特效"
//  作者：Codex  2026-10-14
//
//  ── 原值（查证过的两处）────────────────────────────────────────────────
//    ① 基础零件 cfg  Endurance\Parts\Ranger\ranger.cfg:273-299
//         ModuleRCSFX  thrusterPower = 24   runningEffectName = running_rcs
//         PROPELLANT { LiquidFuel   ratio = 1 }
//         PROPELLANT { ElectricCharge ratio = 375 }
//         atmosphereCurve { key 0 1200 / key 1 300 / key 2 0.01 }
//    ② CRP 补丁  Endurance\Patches\CRP\Engines.cfg:57-
//         LiquidFuel -> LqdHydrogen（比值 1），ElectricCharge ratio 375 -> 5.211
//    为什么耗电这么凶：LqdHydrogen 密度只有 0.00007085 t/u，
//    比冲 1200s、推力 24kN 时单个喷口的单位流量约 29 u/s，
//    再乘 EC 比例就是"几百 EC/s"的来源 —— 这就是这次要砍的东西。
//
//  ── 本次改动 ───────────────────────────────────────────────────────────
//    ① 电耗   ElectricCharge ratio  5.211 -> 0.5     （约 ÷10）
//    ② 燃料   atmosphereCurve 比冲 ×2（1200->2400、300->600）→ 耗氢流量减半
//       两项叠加：RCS 全开的 EC 消耗约为原来的 1/20，推进剂约为 1/2，**推力不变**。
//       想更狠：把 0.5 改成 0.1；想恢复原来的耗氢：把 atmosphereCurve 改回 1200/300。
//    ③ 特效   原 mod 的 RCS 特效用自带网格模型 Endurance/FX/hotFlash*Pink
//       （2015 年的老写法，日志里加载正常但画面上看不到喷焰）。
//       这里照抄原版 RCS（Squad\Parts\Utility\rcsBlockRV-105_v2）的做法，
//       把该特效的模型换成原版白烟 Squad/FX/Monoprop_small —— 和原版 RCS
//       走同一套机制、同一批贴图，KSP 1.12 下必定出图。
//       只换模型名：音量、发射曲线、朝向、推力变换点全部保持原样。
//       如果重启后仍然看不到喷焰，说明效果节点名被别的 mod 改过，
//       告诉我，我按最终缓存（ModuleManager.ConfigCache）再对一次。
//
//  只作用于 ENrangerBody。删掉本文件即完全还原（包括恢复粉色喷焰）。
// ============================================================================

@PART[ENrangerBody]:NEEDS[Endurance]:FINAL
{
	// ---- ① 电耗 + ② 燃料 ----
	@MODULE[ModuleRCSFX]
	{
		@PROPELLANT:HAS[#name[ElectricCharge]]
		{
			@ratio = 0.5
		}
		@atmosphereCurve
		{
			@key,0 = 0 2400
			@key,1 = 1 600
			@key,2 = 2 0.01
		}
	}

	// ---- ③ 喷焰：换成原版 RCS 的白烟模型 ----
	@EFFECTS
	{
		@running_rcs
		{
			@MODEL_MULTI_PARTICLE
			{
				%modelName = Squad/FX/Monoprop_small
			}
		}
	}
}
