// ============================================================================
//  Endurance（电影《星际穿越》部件包）简体中文补丁
//  原作者：JPLRepo　｜　汉化：ModuleManager 补丁，只改文本，不动任何数值
//  覆盖范围：
//    1) 23 个零件的 title / description
//    2) 零件右键菜单（PAW）里的动作文本：居住舱充气/收拢、支腿、旗帜、
//       科学容器（查看/存储）、乘员报告、各类实验、燃料电池/托卡马克/EPS
//       变压器等转换器的 启动/停止/切换
//    3) 实验定义 habcheck（宜居性评估）的标题与全部结果文本
//  用法：放进 GameData\Endurance_CN\ 即可；用 :FINAL 保证在所有其它补丁之后生效
// ============================================================================


// ============================================================================
//  一、零件名与说明
// ============================================================================

@PART[ENcargoContainer]:FINAL
{
	@title = MB-25 货运模块
	@description = 绝对不是改装过的集装箱。真的。我们保证，这玩意儿科技含量很高。
}

@PART[ENdeployableHabitat]:FINAL
{
	@title = MB-75 可展开居住舱
	@description = 在星球表面展开它，就能容纳最多的小绿人。
}

@PART[ENdeployableLab]:FINAL
{
	@title = MB-50 机动分析舱
	@description = 一座机动科学实验室！里面配齐了多种经典实验设备！在星球表面展开、伸出支腿，就能进行科学数据处理。别忘了带上太阳能板和梯子。
}

@PART[ENcolonyflag]:FINAL
{
	@title = 大型地点归属标识器
	@description = 一面大旗子。当你迫切需要让所有人知道"这儿有人"的时候，就用它。
}

@PART[ENbox_small]:FINAL
{
	@title = 先进非增压储物方箱
	@description = 一个科技感十足的箱子，只采用最优质的、降解难度拉满的塑料制成。用来装东西搬来搬去，大概吧。
}

@PART[ENcargoScience]:FINAL
{
	@title = MB-30 实验集成包
	@description = 哈，这个才是真正改装过的集装箱！里面塞满了经典实验设备、RCS、燃料、一根强力天线，还有一枚无人机核心！MB-30 能塞进永恒号的载荷槽，也能挂在登陆舱底部投放，但就是压缩不到能塞进客舱行李架的尺寸。这一点确实挺让人失望。
}

@PART[ENrangerDock]:FINAL
{
	@title = 漫游者号对接口
	@description = 漫游者号对接口用于把漫游者号对接到永恒号上。建议给所有漫游者号的尾部都装一个，永恒号一侧则用于两艘飞船的牢固连接；对接完成之后，分离同样简单。
}

@PART[ENrangerDock125]:FINAL
{
	@title = 永恒号对接口
	@description = 永恒号对接口，功能与 Clamp-O-Tron 对接口完全相同，只是更薄。
}

@PART[ENOuterDock125]:FINAL
{
	@title = 永恒号外侧对接口安装座
	@description = 外侧对接口的安装座，像一套巨型拼装玩具：先把它装在永恒号环体的外侧，再把真正的对接口接上去。
}

@PART[ENOuterRangerDock125]:FINAL
{
	@title = 永恒号外侧漫游者号对接口安装座
	@description = 外侧对接口的安装座，带漫游者号专用的倾角，像一套巨型拼装玩具：先把它装在永恒号环体的外侧，再把真正的对接口接上去。
}

@PART[ENcargoEndurance]:FINAL
{
	@title = EC-215 后勤模块
	@description = 一个增压舱段，储物空间充裕，可存放备用零件，以及长期深空任务中你可能需要的任何东西。
}

@PART[ENcommandEndurance]:FINAL
{
	@title = EC-200b 指令模块
	@description = 本模块设计为永恒号母船的有乘员指令舱。内置一根功率极强的中继天线，代价自然是带宽偏低。
}

@PART[ENenduranceEngine]:FINAL
{
	@title = 永恒号深空发动机
	@description = 为推进永恒号太空探索系统而设计的等离子推进器，效率惊人。必要时能迅速以比冲换取推力，但别指望它在大气层里工作。
}

@PART[ENhabEndurance]:FINAL
{
	@title = EC-200 乘员舱
	@description = 一个增压舱段，装满让乘员在深空活下去所需的一切。为永恒号太空探索系统配套设计。
}

@PART[ENinfirmaryEndurance]:FINAL
{
	@title = EC-220 医疗勤务模块
	@description = 专门用来保障乘员在严酷真空中完成长途飞行的增压舱段，不应计入免费居住空间。它可让最多 4 名乘员睡眠与唤醒 6 次，并更好地应对辐射问题。为永恒号太空探索系统配套设计。
}

@PART[ENmountEndurance]:FINAL
{
	@title = DSPS x300 燃料组件
	@description = 为永恒号太空探索系统设计的燃料箱／发动机安装座。内部装有一块高度先进的燃料电池与一座聚变反应堆，为其配套发动机供电。
}

@PART[ENringEndurance]:FINAL
{
	@title = EC-151 结构环
	@description = 为充当永恒号太空探索系统核心而设计的增压环体。
}

@PART[ENendSciBox]:FINAL
{
	@title = MB-2 宜居性评估单元
	@description = 为永恒号太空探索系统配套设计的科学舱。必须位于天体表面或近表面，才能取得科学数据。
}

@PART[ENlanderBody]:FINAL
{
	@title = 登陆舱机身
	@description = 登陆舱是一种动力强劲的多用途载具，用于把重型物资运上或运离行星表面。
}

@PART[ENlanderVTOL]:FINAL
{
	@title = 登陆舱举升发动机
	@description = 高效率发动机，用于让登陆舱垂直离地。
}

@PART[ENminiRanger]:FINAL
{
	@title = 蝰蛇复合机身
	@description = 蝰蛇是漫游者号的缩小版后继型号——一种高效的大气层乘员载具，可快速把乘员送进轨道、接回地面。
}

@PART[ENrangerBody]:FINAL
{
	@title = 漫游者号
	@description = 漫游者号是一种快速、轻便的乘员载具，为在大气行星上使用而设计。自带对接口、RCS 与垂直起降发动机。
}

@PART[ENrangerEngine]:FINAL
{
	@title = XP-F40「库珀」气动塞式推进器
	@description = XP-F40 是一种双模式等离子推进器，在大气层与真空中都能高效工作。
}


// ============================================================================
//  二、界面动作文本（右键菜单 / 动作组）
//      只作用于 Endurance 自己的零件；按"当前英文原文"定位，因此
//      Power / Power2 / LS_USI / CryoFuelCell 等补丁加进来的模块也能覆盖。
// ============================================================================

@PART[ENcargoContainer|ENdeployableHabitat|ENdeployableLab|ENcolonyflag|ENbox_small|ENcargoScience|ENrangerDock|ENrangerDock125|ENOuterDock125|ENOuterRangerDock125|ENcargoEndurance|ENcommandEndurance|ENenduranceEngine|ENhabEndurance|ENinfirmaryEndurance|ENmountEndurance|ENringEndurance|ENendSciBox|ENlanderBody|ENlanderVTOL|ENminiRanger|ENrangerBody|ENrangerEngine]:FINAL
{
	// ---- MB-30 的操纵点（指令模块的"控制点"下拉）----
	@MODULE[ModuleCommand]
	{
		@defaultControlPointDisplayName = 默认
		@CONTROLPOINT[up]
		{
			@displayName = 上方
		}
	}

	// ---- 科学容器（按原文定位，避免两个分支互相覆盖）----
	@MODULE:HAS[#reviewActionName[Review?Data]]
	{
		@reviewActionName = 查看数据
		@collectActionName = 取走数据
		@storeActionName = 存储实验
	}
	@MODULE:HAS[#reviewActionName[Review?Stored?Data]]
	{
		@reviewActionName = 查看已存数据
		@storeActionName = 存储实验
	}

	// ---- 乘员报告（指令舱 / 漫游者号 / 登陆舱 / 蝰蛇）----
	@MODULE:HAS[#experimentActionName[Crew?Report]]
	{
		@experimentActionName = 乘员报告
		@resetActionName = 丢弃乘员报告
		@reviewActionName = 查看报告
	}

	// ---- MB-2 宜居性评估 ----
	@MODULE:HAS[#experimentActionName[Conduct?Habitability?Assessment]]
	{
		@experimentActionName = 进行宜居性评估
		@resetActionName = 重置宜居性评估
		@collectActionName = 收集数据
	}

	// ---- MB-30 里打包的原版实验 ----
	@MODULE:HAS[#experimentActionName[Observe?Mystery?Goo]]
	{
		@experimentActionName = 观测神秘黏液
		@resetActionName = 重置黏液罐
	}
	@MODULE:HAS[#experimentActionName[Observe?Materials?Bay]]
	{
		@experimentActionName = 观测材料舱
		@resetActionName = 重置材料舱
	}
	@MODULE:HAS[#experimentActionName[Run?Atmosphere?Analysis]]
	{
		@experimentActionName = 进行大气分析
		@resetActionName = 丢弃数据
	}
	@MODULE:HAS[#experimentActionName[Log?Seismic?Data]]
	{
		@experimentActionName = 记录地震数据
		@resetActionName = 删除数据
	}
	@MODULE:HAS[#experimentActionName[Log?Pressure?Data]]
	{
		@experimentActionName = 记录气压数据
		@resetActionName = 删除数据
	}
	@MODULE:HAS[#experimentActionName[Log?Gravity?Data]]
	{
		@experimentActionName = 记录重力数据
		@resetActionName = 删除数据
	}
	@MODULE:HAS[#experimentActionName[Log?Temperature]]
	{
		@experimentActionName = 记录温度
		@resetActionName = 删除数据
	}

	// ---- WildBlueTools 分支的实验（未装 WBT 时不生效，装了就自动中文）----
	@MODULE:HAS[#experimentActionName[Run?Habitability?Orbital?Assessment]]
	{
		@experimentActionName = 进行轨道宜居性评估
		@resetActionName = 重置轨道宜居性评估
		@reviewActionName = 查看轨道评估
	}
	@MODULE:HAS[#experimentActionName[Run?Habitability?Surface?Assessment]]
	{
		@experimentActionName = 进行地表宜居性评估
		@resetActionName = 重置地表宜居性评估
		@reviewActionName = 查看地表评估
	}
	@MODULE:HAS[#experimentActionName[Do?Nothing]]
	{
		@experimentActionName = 不执行操作
		@resetActionName = 重置空操作
	}

	// ---- 动画类动作（居住舱充气 / 分析舱支腿 / 旗帜）----
	@MODULE:HAS[#startEventGUIName[Inflate?Habitat]]
	{
		@startEventGUIName = 充气展开居住舱
		@endEventGUIName = 排气收拢居住舱
		@actionGUIName = 切换居住舱
	}
	@MODULE:HAS[#startEventGUIName[Deploy?Legs]]
	{
		@startEventGUIName = 展开支腿
		@endEventGUIName = 收起支腿
		@actionGUIName = 切换着陆支腿
	}
	@MODULE:HAS[#startEventGUIName[Raise?Flag]]
	{
		@startEventGUIName = 升起旗帜
		@endEventGUIName = 降下旗帜
		@actionGUIName = 切换旗帜
	}
	@MODULE:HAS[#startEventGUIName[Assemble]]
	{
		@startEventGUIName = 组装
		@endEventGUIName = 拆解
	}

	// ---- 燃料电池（Power.cfg 加进来的）----
	@MODULE:HAS[#ConverterName[Fuel?Cell]]
	{
		@ConverterName = 燃料电池
		@StartActionName = 启动燃料电池
		@StopActionName = 停止燃料电池
		@ToggleActionName = 切换燃料电池
	}

	// ---- 聚变反应堆 / 托卡马克（Power2.cfg）----
	@MODULE:HAS[#ConverterName[Tokamak?Reactor]]
	{
		@ConverterName = 托卡马克反应堆
		@StartActionName = 启动托卡马克
		@StopActionName = 停止托卡马克
		@ToggleActionName = 切换托卡马克
	}

	// ---- EPS 变压器（CryoFuelCell.cfg，原文拼写就是 Tranformer，保持一致匹配）----
	@MODULE:HAS[#ConverterName[EPS?Tranformer]]
	{
		@ConverterName = EPS 变压器
		@StartActionName = 启动 EPS 变压器
		@StopActionName = 停止 EPS 变压器
		@ToggleActionName = 切换 EPS 变压器
	}

	// ---- USI 生命保障分支（LS_USI.cfg，本机已装 USI-LS）----
	@MODULE:HAS[#ConverterName[Life?Support]]
	{
		@ConverterName = 生命保障
		@StartActionName = 启动生命保障
		@StopActionName = 停止生命保障
	}
	@MODULE:HAS[#ConverterName[Soil?Recycler]]
	{
		@ConverterName = 土壤回收器
		@StartActionName = 启动土壤回收器
		@StopActionName = 停止土壤回收器
	}
	@MODULE:HAS[#ConverterName[MedBay]]
	{
		@ConverterName = 医疗舱
		@StartActionName = 启动医疗舱
		@StopActionName = 停止医疗舱
	}

	// ---- 其余转换器名称（装在别的分支下时自动生效）----
	@MODULE:HAS[#ConverterName[Air?Scrubber]]
	{
		@ConverterName = 空气净化器
		@StartActionName = 启动空气净化器
		@StopActionName = 停止空气净化器
	}
	@MODULE:HAS[#ConverterName[Air?Maker]]
	{
		@ConverterName = 制氧机
		@StartActionName = 启动制氧机
		@StopActionName = 停止制氧机
	}
	@MODULE:HAS[#ConverterName[Greenhouse]]
	{
		@ConverterName = 温室
		@StartActionName = 启动温室
		@StopActionName = 停止温室
	}
	@MODULE:HAS[#ConverterName[Snack?Processor]]
	{
		@ConverterName = 零食加工机
		@StartActionName = 启动零食加工机
		@StopActionName = 停止零食加工机
	}
	@MODULE:HAS[#ConverterName[Science?Processor]]
	{
		@ConverterName = 科学处理器
		@StartActionName = 启动科学处理器
		@StopActionName = 停止科学处理器
	}
	@MODULE:HAS[#ConverterName[Research?Kit?Assembler]]
	{
		@ConverterName = 研究套件组装机
		@StartActionName = 启动研究套件组装
		@StopActionName = 停止研究套件组装
	}
	@MODULE:HAS[#ConverterName[Entertainment?Center]]
	{
		@ConverterName = 娱乐中心
		@StartActionName = 启动娱乐设施
		@StopActionName = 停止娱乐设施
	}
	@MODULE:HAS[#ConverterName[Geosurvey]]
	{
		@ConverterName = 地质勘测
		@StartActionName = 启动地质勘测
		@StopActionName = 停止地质勘测
	}
	@MODULE:HAS[#ConverterName[Gravity?Wave?Generator]]
	{
		@ConverterName = 引力波发生器
		@StartActionName = 启动引力波发生器
		@StopActionName = 停止引力波发生器
		@ToggleActionName = 切换引力波发生器
	}
	@MODULE:HAS[#ConverterName[Lab?Time]]
	{
		@ConverterName = 实验时间
		@StartActionName = 启动实验时间
		@StopActionName = 停止实验时间
	}
	@MODULE:HAS[#ConverterName[Research]]
	{
		@ConverterName = 研究
		@StartActionName = 启动研究
		@StopActionName = 停止研究
	}
	@MODULE:HAS[#ConverterName[OmniConverter]]
	{
		@ConverterName = 全能转换器
		@StartActionName = 启动转换器
		@StopActionName = 停止转换器
	}
	@MODULE:HAS[#ConverterName[OmniConverter?1]]
	{
		@ConverterName = 全能转换器 1
	}
	@MODULE:HAS[#ConverterName[OmniConverter?2]]
	{
		@ConverterName = 全能转换器 2
	}
	@MODULE:HAS[#ConverterName[OmniConverter?3]]
	{
		@ConverterName = 全能转换器 3
	}
	@MODULE:HAS[#ConverterName[OmniConverter?4]]
	{
		@ConverterName = 全能转换器 4
	}
}


// ============================================================================
//  三、实验定义：宜居性评估（habcheck）
//      结果文本是跑实验时弹出的那段旁白，一并翻译
// ============================================================================

@EXPERIMENT_DEFINITION:HAS[#id[habcheck]]:FINAL
{
	@title = 宜居性评估

	!RESULTS {}
	RESULTS
	{
		default = 此处不适合居住。

		KerbinSrfLandedLaunchpad = 发射台上大概不适合建立殖民地。
		KerbinSrfLandedRunway = 农作物在这儿可不好长。
		KerbinSrfLandedKSC = 这里是我们的航天中心。宜居。
		KerbinFlyingLowGrasslands = 这里很适合建农场。
		KerbinFlyingLowGrasslands = 草原上已经住人了。
		KerbinFlyingLowHighlands = 高地是个不错的降落点。
		KerbinFlyingLowMountains = 这里地形太危险，不适合尝试殖民。
		KerbinFlyingLowDeserts = 沙漠无法长期居住。
		KerbinFlyingLowBadlands = 这儿看起来不是个降落的好地方。
		KerbinFlyingLowTundra = 此地已经逼近宜居极限。
		KerbinFlyingLowIceCaps = 这里气温过低。
		KerbinFlyingLowShores = 海岸很适合建殖民地。
		KeringFlyingLowWater = 有水是好事。可惜基地没法建在水面上。

		EveInSpace = 这颗行星的大气能替它挡住小行星撞击与辐射。也许适合定居。

		DunaInSpace = 这颗行星大气稀薄，且没有氧气。或许能在这里活下来。

		JoolInSpace = 这里辐射太强。
		JoolInSpace = 强辐射加上没有地表，Jool 基本不可能支持生命。

		LaytheInSpace = 这颗星球看起来很有希望。
		LaytheInSpace = 表面大部分被海洋覆盖。这么多水对殖民地非常有用。
	}
}
