// ============================================================================
//  WormholeRelay 配置文件
//
//  sideA / sideB ：虫洞两个口的天体名（就是它们的 SOI / "引力范围"）
//                  Kcalbeloh 默认是 WH3141A（Kerbol 侧，绕太阳 a≈5.33e10 m）
//                  和 WH3141B（Kcalbeloh 侧）
//  linkDistance  ：把跨虫洞的链路"当作"多长（米）。默认 1000 m，
//                  即信号强度按满格算；正常直线距离 271.8 Tm 会直接判不连通。
//
//  规则：一侧一个"中继"（船上至少一根 antennaType = RELAY 的天线），
//        另一侧再有一个中继 → 两边的通信网络自动连成一张网。
//        同一侧的中继之间不受影响（走原版逻辑）。
// ============================================================================

WORMHOLE_RELAY
{
	sideA = WH3141A
	sideB = WH3141B
	linkDistance = 1000
}
