        #loc_KUM_kumGroundFobKSCAssault1_desc = 最近，我们在 KSC 西北方向发现了一个前哨基地，它与袭击 KSC 的空中突击群一同出现。该前哨为敌方突击提供支援，必须立即摧毁。尽快接近并摧毁它，它对我们行动构成严重威胁！再次确保 Kerbin 不受敌军威胁！
        #loc_KUM_kumGroundFobKSCAssault1_completed = 任务完成！敌基地已摧毁，当地敌军行动已瘫痪！

