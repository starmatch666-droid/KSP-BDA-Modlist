        #loc_KUM_kumGroundFobKSCPlains1_desc = 我们在 KSC 以西发现一个离 KSC 危险地近的前进基地。我们的侦察车最近在该地区被击落，因此只能由你来处理。接近该区域并制止他们的行动。
        #loc_KUM_kumGroundFobKSCPlains1_completed = 任务完成！平原再次清空，我们的空域已恢复安全。

