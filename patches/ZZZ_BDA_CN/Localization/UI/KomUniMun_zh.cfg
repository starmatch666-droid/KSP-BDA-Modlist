        #loc_KUM_kumGroundFobBadlandsSteppe1_desc = 敌方在荒地草原的坡地部署了一个前进作战基地（FOB）。这个敌基地离我们的战区太近，绝不能容忍。立即用任何手段摧毁它，但要注意该地区报告有防空火力和固定炮兵。
