// -----------------------------------------------------------------------------
// Electrical endurance and reactor heat/output
// -----------------------------------------------------------------------------

@PART[*]:HAS[@RESOURCE[ElectricCharge],!MODULE[ModuleB9PartSwitch]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @RESOURCE[ElectricCharge]
    {
        @amount *= #$@RSS_PART_BALANCE/batteryCapacityMultiplier$
        @maxAmount *= #$@RSS_PART_BALANCE/batteryCapacityMultiplier$
    }
}

@PART[*]:HAS[@MODULE[ModuleAlternator]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleAlternator],*
    {
        @RESOURCE[ElectricCharge]
        {
            @rate *= #$@RSS_PART_BALANCE/generatorMultiplier$
        }
    }
}

@PART[*]:HAS[@MODULE[ModuleGenerator]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleGenerator],*
    {
        @rate *= #$@RSS_PART_BALANCE/generatorMultiplier$
    }
}

@PART[*]:HAS[@MODULE[ModuleSystemHeatFissionReactor]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleSystemHeatFissionReactor],*
    {
        @ElectricalGeneration
        {
            @key,*[1, ] *= #$@RSS_PART_BALANCE/reactorOutputMultiplier$
        }

        @HeatGeneration
        {
            @key,*[1, ] *= #$@RSS_PART_BALANCE/reactorOutputMultiplier$
        }

        @INPUT_RESOURCE
        {
            @Ratio *= #$@RSS_PART_BALANCE/reactorFuelFlowMultiplier$
        }

        @OUTPUT_RESOURCE
        {
            @Ratio *= #$@RSS_PART_BALANCE/reactorFuelFlowMultiplier$
        }
    }
}

// -----------------------------------------------------------------------------
// Thermal management and re-entry protection
// -----------------------------------------------------------------------------

@PART[*]:HAS[@MODULE[ModuleActiveRadiator]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleActiveRadiator],*
    {
        @maxEnergyTransfer *= #$@RSS_PART_BALANCE/radiatorCapacityMultiplier$

        @RESOURCE[ElectricCharge]
        {
            @rate *= #$@RSS_PART_BALANCE/radiatorPowerMultiplier$
        }
    }
}

@PART[*]:HAS[@MODULE[ModuleAblator]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @maxTemp = #$@RSS_PART_BALANCE/heatShieldMaxTemp$
    @thermalMassModifier *= #$@RSS_PART_BALANCE/heatShieldThermalMassMultiplier$
    @skinInternalConductionMult *= #$@RSS_PART_BALANCE/heatShieldConductivityMultiplier$

    @RESOURCE[Ablator]
    {
        @amount *= #$@RSS_PART_BALANCE/ablatorCapacityMultiplier$
        @maxAmount *= #$@RSS_PART_BALANCE/ablatorCapacityMultiplier$
    }

    @MODULE[ModuleAblator],*
    {
        @lossConst *= #$@RSS_PART_BALANCE/heatShieldLossMultiplier$
        @reentryConductivity *= #$@RSS_PART_BALANCE/heatShieldConductivityMultiplier$
    }
}

// -----------------------------------------------------------------------------
// Deep-space CommNet coverage
//
// RealSolarSystem already multiplies antenna power by 20. This adds another
// x10 so direct DSN links and paired relays cover the outer solar system.
// -----------------------------------------------------------------------------

@PART[*]:HAS[@MODULE[ModuleDataTransmitter]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleDataTransmitter],*
    {
        @antennaPower *= #$@RSS_PART_BALANCE/antennaPowerMultiplier$

        @UPGRADES
        {
            @UPGRADE,*
            {
                @antennaPower *= #$@RSS_PART_BALANCE/antennaUpgradePowerMultiplier$
            }
        }
    }
}

