// RSS part balance for the current Near Future / Far Future / Cryo / Atomic stack.
// This is a compatibility balance, not a Realism Overhaul replacement.
// Rocket-engine values are anchored to the stock KS-25 / real RS-25 pair.
//
// KS-25 before this patch: 4.0 t, 1000 kN vacuum, 315 / 295 s Isp.
// RS-25 target:            3.526 t, 2279 kN vacuum, 452.3 / 366 s Isp.
//
// KSP derives sea-level thrust from maxThrust and the Isp curve. Matching
// both published thrust values and both Isp endpoints exactly is therefore
// overdetermined. The vacuum thrust endpoint is used as the anchor; the
// resulting sea-level thrust is about 1844 kN versus 1860 kN real (-0.9%).
//
// Air-breathing values are anchored to the stock J-X4 Whiplash / J58 pair:
// Whiplash:     1.8 t, 130 kN maximum thrust.
// J58 target:   2.721554 t, 151.239535 kN uninstalled sea-level wet thrust.
// Whiplash's 4000 s equivalent Isp already corresponds to the J58 dry TSFC
// of about 0.9 lb/(lbf*h), so its Isp and Mach/altitude curves are preserved.
//
// Large high-bypass turbofans use a GE90-class secondary calibration. The
// Goliath anchor becomes 8.8 t and 514 kN, then the same class correction is
// applied to the other large high-bypass turbofans to preserve their relative
// stock sizing. Low-bypass, afterburning and lift-fan engines keep the J58 set.
// Edit the calibration values below to retune the whole engine patch.

RSS_PART_BALANCE
{
    engineThrustMultiplier = 2.279
    engineVacuumIspMultiplier = 1.435873016
    engineSeaLevelIspTrimMultiplier = 0.864058278
    engineHeatMultiplier = 3.0
    engineMassMultiplier = 0.8815
    engineCostMultiplier = 1.50

    jetThrustMultiplier = 1.163381038
    jetHeatMultiplier = 1.163381038
    jetMassMultiplier = 1.511974567
    highBypassTurbofanMassTrimMultiplier = 1.293378605
    highBypassTurbofanThrustTrimMultiplier = 1.227265815

    tankCapacityMultiplier = 3.0
    tankMassMultiplier = 1.15
    tankStrengthMultiplier = 2.0

    rcsThrustMultiplier = 3.0
    rcsHeatMultiplier = 2.5
    rcsIspMultiplier = 1.08

    // Compensates for the increased wet mass of RSS-Lite fuel tanks without
    // increasing air-breathing engine thrust.
    aircraftLiftMultiplier = 2.5

    batteryCapacityMultiplier = 2.0
    generatorMultiplier = 2.0
    reactorOutputMultiplier = 3.0
    reactorFuelFlowMultiplier = 3.0

    radiatorCapacityMultiplier = 3.5
    radiatorPowerMultiplier = 1.5
    passiveRadiatorMultiplier = 1.50

    ablatorCapacityMultiplier = 10.0
    heatShieldMaxTemp = 5000
    heatShieldThermalMassMultiplier = 2.0
    heatShieldLossMultiplier = 0.10
    heatShieldConductivityMultiplier = 0.10

    // Applied in addition to RealSolarSystem's own x20 antenna patch.
    antennaPowerMultiplier = 10.0
    antennaUpgradePowerMultiplier = 10.0
}

// -----------------------------------------------------------------------------
// Non-airbreathing rocket engines
// -----------------------------------------------------------------------------

@PART[*]:HAS[@MODULE[ModuleEnginesFX]:HAS[!PROPELLANT[IntakeAir]]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @mass *= #$@RSS_PART_BALANCE/engineMassMultiplier$
    @cost *= #$@RSS_PART_BALANCE/engineCostMultiplier$

        @MODULE[ModuleEnginesFX]:HAS[!PROPELLANT[IntakeAir]]
    {
        @minThrust *= #$@RSS_PART_BALANCE/engineThrustMultiplier$
        @maxThrust *= #$@RSS_PART_BALANCE/engineThrustMultiplier$
        @heatProduction *= #$@RSS_PART_BALANCE/engineHeatMultiplier$

        @atmosphereCurve
        {
            @key,*[1, ] *= #$@RSS_PART_BALANCE/engineVacuumIspMultiplier$
            @key,1[1, ] *= #$@RSS_PART_BALANCE/engineSeaLevelIspTrimMultiplier$
        }
    }
}

// Legacy ModuleEngines support for older part packs.
@PART[*]:HAS[@MODULE[ModuleEngines]:HAS[!PROPELLANT[IntakeAir]]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @mass *= #$@RSS_PART_BALANCE/engineMassMultiplier$
    @cost *= #$@RSS_PART_BALANCE/engineCostMultiplier$

        @MODULE[ModuleEngines]:HAS[!PROPELLANT[IntakeAir]]
    {
        @minThrust *= #$@RSS_PART_BALANCE/engineThrustMultiplier$
        @maxThrust *= #$@RSS_PART_BALANCE/engineThrustMultiplier$
        @heatProduction *= #$@RSS_PART_BALANCE/engineHeatMultiplier$

        @atmosphereCurve
        {
            @key,*[1, ] *= #$@RSS_PART_BALANCE/engineVacuumIspMultiplier$
            @key,1[1, ] *= #$@RSS_PART_BALANCE/engineSeaLevelIspTrimMultiplier$
        }
    }
}

// -----------------------------------------------------------------------------
// Air-breathing engines
//
// Preserve each engine's original Mach and altitude curves. Only mass, rated
// thrust and heat production are calibrated from the Whiplash / J58 pair.
// Mass is applied only to parts without a rocket-mode engine so hybrid parts
// do not receive both the rocket and jet mass factors.
// -----------------------------------------------------------------------------

@PART[*]:HAS[@MODULE[ModuleEnginesFX]:HAS[@PROPELLANT[IntakeAir]],!MODULE[ModuleEnginesFX]:HAS[!PROPELLANT[IntakeAir]],!MODULE[ModuleEngines]:HAS[!PROPELLANT[IntakeAir]]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @mass *= #$@RSS_PART_BALANCE/jetMassMultiplier$
}

@PART[*]:HAS[@MODULE[ModuleEngines]:HAS[@PROPELLANT[IntakeAir]],!MODULE[ModuleEngines]:HAS[!PROPELLANT[IntakeAir]],!MODULE[ModuleEnginesFX]:HAS[!PROPELLANT[IntakeAir]]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @mass *= #$@RSS_PART_BALANCE/jetMassMultiplier$
}

@PART[*]:HAS[@MODULE[ModuleEnginesFX]:HAS[@PROPELLANT[IntakeAir]]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleEnginesFX]:HAS[@PROPELLANT[IntakeAir]]
    {
        @minThrust *= #$@RSS_PART_BALANCE/jetThrustMultiplier$
        @maxThrust *= #$@RSS_PART_BALANCE/jetThrustMultiplier$
        @heatProduction *= #$@RSS_PART_BALANCE/jetHeatMultiplier$
    }
}

@PART[*]:HAS[@MODULE[ModuleEngines]:HAS[@PROPELLANT[IntakeAir]]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleEngines]:HAS[@PROPELLANT[IntakeAir]]
    {
        @minThrust *= #$@RSS_PART_BALANCE/jetThrustMultiplier$
        @maxThrust *= #$@RSS_PART_BALANCE/jetThrustMultiplier$
        @heatProduction *= #$@RSS_PART_BALANCE/jetHeatMultiplier$
    }
}

// Large high-bypass turbofans: GE90-class correction layered over the J58
// baseline. Combined final factors are 1.955556 mass and 1.427778 thrust.
@PART[turboFanSize2,nfa-turbofan-25-1,M3X_XLTurbofan,M3X_Turbofan]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @mass *= #$@RSS_PART_BALANCE/highBypassTurbofanMassTrimMultiplier$

    @MODULE[ModuleEnginesFX]:HAS[@PROPELLANT[IntakeAir]]
    {
        @minThrust *= #$@RSS_PART_BALANCE/highBypassTurbofanThrustTrimMultiplier$
        @maxThrust *= #$@RSS_PART_BALANCE/highBypassTurbofanThrustTrimMultiplier$
        @heatProduction *= #$@RSS_PART_BALANCE/highBypassTurbofanThrustTrimMultiplier$
    }

    @MODULE[ModuleEngines]:HAS[@PROPELLANT[IntakeAir]]
    {
        @minThrust *= #$@RSS_PART_BALANCE/highBypassTurbofanThrustTrimMultiplier$
        @maxThrust *= #$@RSS_PART_BALANCE/highBypassTurbofanThrustTrimMultiplier$
        @heatProduction *= #$@RSS_PART_BALANCE/highBypassTurbofanThrustTrimMultiplier$
    }
}

// -----------------------------------------------------------------------------
// Aircraft lift
//
// Fuel capacity is increased globally for RSS-Lite. Raise wing, control-surface
// and lifting-body coefficients so spaceplanes remain controllable at that mass.
// -----------------------------------------------------------------------------

@PART[*]:HAS[@MODULE[ModuleLiftingSurface]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleLiftingSurface],*
    {
        @deflectionLiftCoeff *= #$@RSS_PART_BALANCE/aircraftLiftMultiplier$
    }
}

@PART[*]:HAS[@MODULE[ModuleControlSurface]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleControlSurface],*
    {
        @deflectionLiftCoeff *= #$@RSS_PART_BALANCE/aircraftLiftMultiplier$
    }
}

