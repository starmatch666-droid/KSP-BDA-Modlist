@PART[*]:HAS[@MODULE[ModuleRCSFX]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
{
    @MODULE[ModuleRCSFX],*
    {
        @thrusterPower *= #$@RSS_PART_BALANCE/rcsThrustMultiplier$
        @heatProduction *= #$@RSS_PART_BALANCE/rcsHeatMultiplier$

        @atmosphereCurve
        {
            @key,*[1, ] *= #$@RSS_PART_BALANCE/rcsIspMultiplier$
        }
    }
}

@PART[*]:HAS[@MODULE[ModuleRCS]]:NEEDS[RealSolarSystem,!RealismOverhaul]:FOR[ZZZ_RSS_PartBalance]
