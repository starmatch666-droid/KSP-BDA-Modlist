// KS-500-O 本地工业补丁
// 目的：让 KS-500-O 在 Duna/远离 Kerbin 的殖民地中，能用本地 MaterialKits + EC
// 合成 Konstruction 需要的 Alloys / Electronics / Synthetics / Robotics / Prototypes。
// 不修改 Konstruction 的建造成本，只补本地生产链和船坞仓储。

// 船坞自带 USI 仓库，否则 Konstruction 的 GetResourceQty 找不到船上的资源。
@PART[Konstruction_Orbital_Shipyard_500]:NEEDS[Konstruction]:HAS[!MODULE[USI_ModuleResourceWarehouse]]
{
	MODULE
	{
		name = USI_ModuleResourceWarehouse
		localTransferEnabled = true
	}
}

// 船坞内部缓冲。装满后总质量约 54 t，按需增减。
@PART[Konstruction_Orbital_Shipyard_500]:NEEDS[Konstruction]
{
	RESOURCE
	{
		name = MaterialKits
		amount = 0
		maxAmount = 20000
	}

	RESOURCE
	{
		name = SpecializedParts
		amount = 0
		maxAmount = 5000
	}

	RESOURCE
	{
		name = Alloys
		amount = 0
		maxAmount = 1000
	}

	RESOURCE
	{
		name = Synthetics
		amount = 0
		maxAmount = 1000
	}

	RESOURCE
	{
		name = Robotics
		amount = 0
		maxAmount = 500
	}

	RESOURCE
	{
		name = Electronics
		amount = 0
		maxAmount = 500
	}

	RESOURCE
	{
		name = Prototypes
		amount = 0
		maxAmount = 200
	}

	// ---------- 本地合成：MaterialKits -> 高级资源 ----------
	// 比例按资源 unitCost 做价值等价：输入 MaterialKits 的价值 ≈ 输出资源的价值。

	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = 合金合成
		StartActionName = 启动合金合成
		StopActionName = 停止合金合成
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.1
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1

		INPUT_RESOURCE
		{
			ResourceName = MaterialKits
			Ratio = 3.0
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 30
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Alloys
			Ratio = 0.01
			DumpExcess = false
		}
	}

	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = 电子元件合成
		StartActionName = 启动电子元件合成
		StopActionName = 停止电子元件合成
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.1
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1

		INPUT_RESOURCE
		{
			ResourceName = MaterialKits
			Ratio = 1.91
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 30
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Electronics
			Ratio = 0.01
			DumpExcess = false
		}
	}

	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = 合成材料合成
		StartActionName = 启动合成材料合成
		StopActionName = 停止合成材料合成
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.1
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1

		INPUT_RESOURCE
		{
			ResourceName = MaterialKits
			Ratio = 3.5
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 30
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Synthetics
			Ratio = 0.01
			DumpExcess = false
		}
	}

	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = 机器人部件合成
		StartActionName = 启动机器人部件合成
		StopActionName = 停止机器人部件合成
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.1
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1

		INPUT_RESOURCE
		{
			ResourceName = MaterialKits
			Ratio = 17.5
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 60
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Robotics
			Ratio = 0.01
			DumpExcess = false
		}
	}

	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = 原型件合成
		StartActionName = 启动原型件合成
		StopActionName = 停止原型件合成
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.1
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1

		INPUT_RESOURCE
		{
			ResourceName = MaterialKits
			Ratio = 150
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 300
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Prototypes
			Ratio = 0.01
			DumpExcess = false
		}
	}
}
